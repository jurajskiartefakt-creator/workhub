<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorkHub v29 – stabilny test czatu</title>
<style>
:root{--blue:#2f66e8;--navy:#0b1738;--bg:#f3f6fb;--card:#fff;--muted:#64728b;--line:#dbe3f0;--green:#238447}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#14213d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:17px;padding-bottom:90px}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.hero{background:var(--navy);color:white;border-radius:0 0 46px 46px;padding:42px 24px 34px}.hero h1{font-size:38px;margin:0 0 8px}.hero p{font-size:19px;color:#d5def3;margin:0;line-height:1.35}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #0b17380b}.center{text-align:center}.muted,.small{color:var(--muted)}.small{font-size:14px}.notice{background:#fff7d8;border:1px solid #efd16a;border-radius:18px;padding:14px;margin:12px 0}.success{background:#eaf8ee;border-color:#a8ddb7}.danger{background:#fff0f0;border-color:#efb0b0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role{background:#f0f4fc;border:2px solid transparent;border-radius:20px;padding:17px;text-align:left;min-height:100px}.role.active{border-color:var(--blue);background:#eaf0ff}.primary,.ghost{border-radius:18px;padding:15px 20px;font-weight:800}.primary{background:var(--blue);color:#fff}.ghost{background:#edf3ff;color:#24539e}.full{width:100%}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:17px;padding:14px 16px;background:white;color:#14213d}textarea{min-height:120px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions>*{flex:1;min-width:130px}.range{padding:0;border:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tab{background:#eee;color:#14213d;border-radius:17px;padding:14px;font-weight:800}.tab.active{background:var(--blue);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{display:inline-block;background:#edf3ff;color:#29569f;border-radius:20px;padding:7px 12px;font-weight:800;font-size:14px;margin:3px}.offer h3{font-size:23px;margin:5px 0}.price{font-size:26px;color:var(--green);font-weight:900}.meta{color:var(--muted);margin:8px 0}.offer .desc{white-space:pre-wrap;line-height:1.4}.bottom{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.bottom button{background:transparent;color:#64728b;font-weight:800;font-size:13px}.bottom .active{color:var(--blue)}.modal{position:fixed;inset:0;background:#0b173855;display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}.modalbox{background:white;border-radius:30px 30px 0 0;max-width:720px;width:100%;padding:24px}.chatbox{background:#f5f7fb;border-radius:22px;padding:14px;min-height:260px;max-height:55vh;overflow:auto}.msg{max-width:82%;padding:13px 16px;border-radius:20px;margin:8px 0;background:#e6edf9}.msg.mine{margin-left:auto;background:#d7e4ff}.msg .who{font-size:12px;color:#64728b;margin-top:5px}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:650px){.grid,.roles{grid-template-columns:1fr}.hero h1{font-size:32px}.card{border-radius:24px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .full{grid-column:1/-1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbw_SxYnRGlUWk6iMHemDNWXcdO16VQgqKbvCkzycT58l1oW4dQngR_glPfa3YW68CWv/exec';
const STATE_KEY='WORKHUB_STATE_V29';
const GUEST_KEY='WORKHUB_GUEST_ID';
const guestId=localStorage.getItem(GUEST_KEY)||(()=>{const x='G'+crypto.randomUUID().replaceAll('-','').slice(0,20).toUpperCase();localStorage.setItem(GUEST_KEY,x);return x})();
const state={market:[],messages:[],favorites:[],joinedItems:[],chatCounts:{},lat:null,lng:null,radius:10,search:'',area:'',side:'ALL',kind:'ALL',view:'home',item:null,login:'',role:'BROWSE',onboarded:false,locationPrompt:false,locationBusy:false,backendOk:false,backendVersion:'',backendError:'',syncing:false,pending:[],toast:'',chatDraft:'',chatSending:false,chatJoining:false};

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(STATE_KEY,JSON.stringify(state))}catch{}}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem(STATE_KEY)||'{}'))}catch{}}
function backend(action,data={}){return new Promise((resolve,reject)=>{const cb='wh29_'+Date.now()+'_'+Math.random().toString(36).slice(2);let done=false;const sc=document.createElement('script');const finish=(ok,v)=>{if(done)return;done=true;delete window[cb];sc.remove();ok?resolve(v):reject(new Error(v?.error||'Błąd bazy'))};window[cb]=r=>r&&r.ok?finish(true,r):finish(false,r||{error:'Baza zwróciła błąd'});sc.onerror=()=>finish(false,{error:'Brak odpowiedzi z serwera WorkHub'});sc.src=BACKEND_URL+'?action='+encodeURIComponent(action)+'&callback='+cb+'&data='+encodeURIComponent(JSON.stringify(data));document.body.appendChild(sc);setTimeout(()=>finish(false,{error:'Przekroczono 10 s — serwer WorkHub nie odpowiedział'}),10000)})}
function norm(x,side,kind){return {...x,ID:String(x.ID??x.id??''),SIDE:(x.SIDE||side)==='SELL'?'SELL':'BUY',KIND:(x.KIND||kind)==='PRODUCT'?'PRODUCT':'SERVICE',TYTUL:String(x.TYTUL??x.title??x.NAZWA??''),KATEGORIA:String(x.KATEGORIA??x.cat??''),OBSZAR:String(x.OBSZAR??x.area??''),CENA:x.CENA??x.price??'',TERMIN:x.TERMIN??x.when??x.DOSTĘPNOŚĆ??'',OPIS:String(x.OPIS??x.desc??''),STATUS:String(x.STATUS??'open').toLowerCase(),GUEST_ID:String(x.GUEST_ID??x.guestId??''),LAT:x.LAT??x.lat??null,LNG:x.LNG??x.lng??null}}
function mergeMarket(r){const a=[];(r.market||[]).forEach(x=>a.push(norm(x)));(r.jobs||[]).forEach(x=>a.push(norm(x,'BUY','SERVICE')));(r.offers||[]).forEach(x=>a.push(norm(x,'SELL','SERVICE')));const m=new Map();[...state.market,...a].forEach(x=>x.ID&&m.set(x.ID,x));state.market=[...m.values()]}
function mergeMessages(a){const m=new Map(state.messages.map(x=>[String(x.ID),x]));(a||[]).forEach(x=>m.set(String(x.ID),x));state.messages=[...m.values()].sort((a,b)=>String(a.UTWORZONO).localeCompare(String(b.UTWORZONO)))}
function clean(s){return String(s??'').toLowerCase().replace(/ł/g,'l').replace(/[ąćęłńóśźż]/g,c=>({ą:'a',ć:'c',ę:'e',ł:'l',ń:'n',ó:'o',ś:'s',ź:'z',ż:'z'}[c])).replace(/[^a-z0-9]+/g,' ').trim()}
const SYN={hydraulik:['hydraulik','hydraulika','hydrauliczne','kran','bateria','zlew','zawor','rura','przeciek','cieknie'],koszenie:['koszenie','trawa','trawnik','ogrodnik','ogrod'],elektryk:['elektryk','elektryka','prad','gniazdko','instalacja'],transport:['transport','przewoz','przeprowadzka','bus','laweta'],sprzatanie:['sprzatanie','czyszczenie','mycie','porzadki'],remont:['remont','glazura','plytki','tynk','gips','montaz']};
function terms(q){const t=clean(q).split(/\s+/).filter(Boolean),o=new Set(t);t.forEach(x=>(SYN[x]||[]).forEach(y=>o.add(clean(y))));for(const [k,v] of Object.entries(SYN))if(v.some(y=>clean(y).includes(t[0]||'')||t.includes(k)))v.forEach(y=>o.add(clean(y)));return [...o]}
function distance(a,b,c,d){if([a,b,c,d].some(x=>x==null||x===''||isNaN(x)))return null;const R=6371,p=Math.PI/180,A=(c-a)*p,B=(d-b)*p;const q=Math.sin(A/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(B/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function match(x){if(x.STATUS==='closed')return false;let hay=clean([x.TYTUL,x.KATEGORIA,x.OBSZAR,x.OPIS,x.CENA,x.TERMIN].join(' '));if(state.search&&!terms(state.search).some(t=>hay.includes(t)))return false;if(state.area&&!clean(x.OBSZAR).includes(clean(state.area)))return false;if(state.side!=='ALL'&&x.SIDE!==state.side)return false;if(state.kind!=='ALL'&&x.KIND!==state.kind)return false;const d=distance(state.lat,state.lng,x.LAT,x.LNG);x.__d=d;if(d!=null&&d>state.radius&&!state.favorites.includes(x.ID))return false;return true}

function welcome(){return `<div class="hero"><h1>WORKHUB WITA!</h1><p>Lokalny rynek pracy, usług i towarów.<br>Anonimowo. Blisko Ciebie.</p></div><div class="wrap"><section class="card"><div class="center"><div style="font-size:58px">👋</div><h2>Witaj w WorkHub</h2><p class="muted">Zanim pokażemy lokalny rynek, utwórz swój tymczasowy profil.</p></div><label>Tymczasowy login</label><input id="login" maxlength="24" autocomplete="nickname" value="${esc(state.login)}" placeholder="np. Julek23"><p class="small">Nie podawaj imienia i nazwiska. Login jest pseudonimem używanym w WorkHub.</p><h3>W jakim charakterze przeszukujesz bazę?</h3><div class="roles">${roleBtn('WORK','🧰','Szukam pracy / zleceń','Chcę znaleźć coś, co mogę wykonać.')}${roleBtn('BUY','🛒','Potrzebuję / kupię','Szukam usługi albo towaru.')}${roleBtn('SELL','🏷️','Oferuję / sprzedam','Mam usługę albo towar dla innych.')}${roleBtn('BROWSE','🔎','Przeglądam wszystko','Chcę zobaczyć lokalny rynek.')}</div><button class="primary full" id="enter" style="margin-top:16px">🚀 WEJDŹ DO WORKHUB</button><p class="small center">Następnie WorkHub poprosi o potwierdzenie lokalizacji i ustalenie promienia.</p></section></div>`}
function roleBtn(id,ico,title,desc){return `<button class="role ${state.role===id?'active':''}" data-role="${id}">${ico} <b>${title}</b><br><span class="small">${desc}</span></button>`}

function home(){const results=state.market.filter(match).sort((a,b)=>(a.__d??99999)-(b.__d??99999));const status=state.syncing?'🔄 Łączenie ze wspólną bazą…':state.backendOk?'🟢 Wspólna baza połączona':'🟡 Brak połączenia z bazą';return `<div class="hero"><h1>WORKHUB</h1><p>Witaj, <b>${esc(state.login)}</b> · ${roleName()}</p></div><div class="wrap"><section class="card"><div class="row"><h2>🔎 Znajdź w okolicy</h2><span class="pill">${state.radius} km</span></div><div class="notice">👤 <b>${esc(state.login)}</b> · ${roleName()}<br><span class="small">Promień liczymy względem potwierdzonej lokalizacji urządzenia.</span></div><div class="grid"><div><label>Czego szukasz?</label><input id="q" value="${esc(state.search)}" placeholder="np. hydraulik, koszenie, rower..."></div><div><label>Gdzie?</label><input id="area" value="${esc(state.area)}" placeholder="np. Zawiercie, Poręba..."></div></div><label>Promień: <b>${state.radius} km</b></label><input id="rad" class="range" type="range" min="1" max="50" value="${state.radius}"><div class="actions"><button class="primary" id="search">🔎 SZUKAJ</button><button class="ghost" id="refresh">🔄 Odśwież</button></div><div class="tabs"><button class="tab ${state.side==='ALL'?'active':''}" data-side="ALL">Wszystko</button><button class="tab ${state.side==='BUY'?'active':''}" data-side="BUY">🛒 Potrzebuję</button><button class="tab ${state.side==='SELL'?'active':''}" data-side="SELL">🏷️ Oferuję</button><button class="tab ${state.kind==='PRODUCT'?'active':''}" data-kind="PRODUCT">📦 Towary</button></div>${state.side==='SELL'?'<div class="notice success"><b>🏷️ Tryb: Oferuję</b><br><span class="small">Możesz teraz przeglądać oferty sprzedaży albo od razu dodać własną ofertę pod loginem '+esc(state.login)+'.</span><br><button class="primary" id="quickOffer" style="margin-top:10px">➕ Dodaj własną ofertę</button></div>':''}<p class="small">Po potwierdzeniu lokalizacji WorkHub pokazuje automatycznie wszystkie aktywne oferty w ustawionym promieniu. Wspólny strumień łączy potrzeby i oferty.</p>${state.backendOk?'<div class="notice success">🟢 Baza WorkHub połączona</div>':state.syncing?'<div class="notice">🟡 Łączę z bazą WorkHub…</div>':'<div class="notice danger">🔴 Baza WorkHub nie odpowiada.<br><span class="small">'+esc(state.backendError||'Brak odpowiedzi')+'.</span><br><button class="primary" id="retrySync" style="margin-top:10px">🔄 Spróbuj ponownie</button></div>'}</section><section class="card"><div class="row"><h2>📍 Oferty w okolicy</h2><span class="pill">${results.length} wynik${results.length===1?'':'ów'}</span></div>${results.length?results.map(card).join(''):`<div class="empty">${state.syncing?'Pobieram oferty…':(!state.backendOk?'<b>Nie udało się połączyć ze wspólną bazą.</b><br><span class="small">To nie jest błąd wyszukiwania — WorkHub nie otrzymał odpowiedzi z serwera.</span><br><br><button class="primary" id="retrySync">🔄 Połącz ponownie</button>':(state.side==='SELL'?'<b>Nie ma jeszcze ofert sprzedaży w tym promieniu.</b><br><span class="small">To dobry moment, aby Jacek123 opublikował własną ofertę.</span><br><br><button class="primary" id="emptyAdd">🏷️ Dodaj swoją ofertę</button>':state.side==='BUY'?'<b>Nie ma jeszcze potrzeb w tym promieniu.</b><br><br><button class="primary" id="emptyAdd">🛒 Dodaj swoją potrzebę</button>':'Brak ofert spełniających warunki. Zwiększ promień albo wyczyść wyszukiwanie.'))}</div>`}</section></div>`}
function card(x){const cc=state.chatCounts[x.ID]||0;return `<article class="card offer"><div class="row"><h3>${x.SIDE==='BUY'?'🛒':'🏷️'} ${esc(x.TYTUL)}</h3><div class="price">${esc(x.CENA||'do uzgodnienia')}</div></div><div><span class="pill">${x.SIDE==='BUY'?'POTRZEBUJĘ':'OFERUJĘ'}</span><span class="pill">${x.KIND==='PRODUCT'?'TOWAR':'USŁUGA'}</span><span class="pill">${esc(x.KATEGORIA||'inne')}</span><span class="pill">💬 ${cc} os.</span></div><p class="meta">📍 ${esc(x.OBSZAR||'')} ${x.__d!=null?'· '+x.__d.toFixed(1)+' km':''} · 🕐 ${esc(x.TERMIN||'do uzgodnienia')}</p><p class="desc">${esc(x.OPIS)}</p><div class="actions"><button class="primary" data-open="${esc(x.ID)}">Zobacz ofertę</button><button class="ghost" data-fav="${esc(x.ID)}">${state.favorites.includes(x.ID)?'★ Obserwujesz':'☆ Obserwuj'}</button></div></article>`}

function add(){const offering=state.side==='SELL';return `<div class="wrap"><section class="card"><h2>➕ ${offering?'Oferuj / sprzedaj':'Potrzebuję / kupię'}</h2><div class="notice">👤 <b>${esc(state.login)}</b> · ${offering?'🏷️ Oferuję / sprzedam':'🛒 Potrzebuję / kupię'}<br><span class="small">Ta oferta zostanie opublikowana pod Twoim tymczasowym loginem i przypisana do tego urządzenia.</span></div><div class="tabs"><button class="tab ${!offering?'active':''}" data-formside="BUY">🛒 Potrzebuję / kupię</button><button class="tab ${offering?'active':''}" data-formside="SELL">🏷️ Oferuję / sprzedam</button></div><label>${offering?'Co oferujesz?':'Czego potrzebujesz?'}</label><input id="title" placeholder="${offering?'np. Hydraulik – naprawy':'np. Potrzebuję hydraulika'}"><label>Rodzaj</label><select id="kind"><option value="SERVICE">Usługa</option><option value="PRODUCT">Towar</option></select><label>Kategoria</label><input id="cat" placeholder="np. Naprawy, transport, ogród"><label>Gdzie?</label><input id="addarea" value="${esc(state.area||'')}" placeholder="np. Zawiercie"><div class="grid"><div><label>Cena / budżet</label><input id="price" placeholder="np. 100 zł"></div><div><label>Termin / dostępność</label><input id="when" placeholder="np. dzisiaj po 17:00"></div></div><label>Opis</label><textarea id="desc" placeholder="Szczegóły oferty..."></textarea><button class="primary full" id="publish">🚀 ${offering?'Opublikuj ofertę':'Opublikuj potrzebę'}</button></section></div>`}
function detail(){const x=state.market.find(z=>z.ID===String(state.item));if(!x)return `<div class="wrap"><div class="card">Nie znaleziono oferty.</div></div>`;const msgs=itemMessages(x);const mine=x.GUEST_ID===guestId;const joined=mine||state.joinedItems.includes(x.ID);const count=state.chatCounts[x.ID]||((mine)?1:0);let chatAction;if(joined)chatAction=`<button class="primary" id="openChat">💬 Otwórz wspólny czat</button>`;else chatAction=`<button class="primary" id="joinChat">💬 Dołącz do czatu${count?` · ${count} os.`:''}</button>`;return `<div class="wrap"><section class="card"><button class="ghost" data-nav="home">← Wróć</button><h2>${x.SIDE==='BUY'?'🛒':'🏷️'} ${esc(x.TYTUL)}</h2><span class="pill">${x.SIDE==='BUY'?'POTRZEBUJĘ':'OFERUJĘ'}</span><span class="pill">${x.KIND==='PRODUCT'?'TOWAR':'USŁUGA'}</span><span class="pill">${esc(x.KATEGORIA||'inne')}</span><p class="meta">📍 ${esc(x.OBSZAR)} · 🕐 ${esc(x.TERMIN||'do uzgodnienia')}</p><h2>${esc(x.CENA||'do uzgodnienia')}</h2><p class="desc">${esc(x.OPIS)}</p><div class="notice">💬 <b>Wspólny czat tej oferty · ${count||1} os.</b><br><span class="small">Do jednego czatu mogą dołączyć osoby z telefonu i komputera. Wiadomości widzą uczestnicy tego czatu oraz właściciel oferty.</span></div><div class="actions">${chatAction}<button class="ghost" data-fav="${x.ID}">${state.favorites.includes(x.ID)?'★ Obserwujesz':'☆ Obserwuj'}</button></div></section></div>`}
function itemMessages(x){return state.messages.filter(m=>String(m.JOB_ID||m.OFFER_ID||'')===String(x.ID))}
function chat(){const x=state.market.find(z=>z.ID===String(state.item));if(!x)return '';const msgs=itemMessages(x);const count=state.chatCounts[x.ID]||((x.GUEST_ID===guestId)?1:0);const joined=state.joinedItems.includes(x.ID)||x.GUEST_ID===guestId;if(!joined)return `<div class="wrap"><section class="card"><button class="ghost" data-nav="detail">← Wróć</button><h2>💬 Wspólny czat</h2><p class="meta">${esc(x.TYTUL)} · 📍 ${esc(x.OBSZAR)} · anonimowo</p><div class="notice">Aby zobaczyć rozmowę, najpierw dołącz do czatu tej oferty.</div><button class="primary full" id="joinChat">💬 Dołącz do czatu</button></section></div>`;return `<div class="wrap"><section class="card"><button class="ghost" data-nav="detail">← Wróć</button><h2>💬 Wspólny czat</h2><p class="meta">${esc(x.TYTUL)} · 📍 ${esc(x.OBSZAR)} · anonimowo</p><div class="notice success">💬 <b>Wspólny czat · ${count||1} uczestn${count===1?'ik':'ików'}</b><br><span class="small">Ta sama rozmowa działa jednocześnie na telefonach i komputerach. Wiadomości są przypisane do oferty, nie do urządzenia.</span></div><div class="chatbox" id="chatbox">${msgs.length?msgs.map(m=>`<div class="msg ${String(m.GUEST_ID)===guestId?'mine':''}">${esc(m.TEKST)}<div class="who">${String(m.GUEST_ID)===guestId?'Ty':esc(m.AUTOR||'Użytkownik')}${m.PENDING?' · ⏳ oczekuje na zapis':m.SENT_OK?' · ✓ zapisano':''}</div></div>`).join(''):'<div class="empty">Brak wiadomości w tej rozmowie.<br>Napisz pierwszą wiadomość poniżej.</div>'}</div><label>Wiadomość do uczestników tego czatu</label><textarea id="msg" placeholder="Napisz wiadomość...">${esc(state.chatDraft||'')}</textarea><button class="primary full" id="send" ${state.chatSending?'disabled':''}>${state.chatSending?'⏳ Zapisuję…':'Wyślij wiadomość'}</button><div class="notice">🔒 Anonimowość: uczestnicy widzą pseudonim/login użyty w WorkHub. Nie udostępniamy automatycznie telefonu, e-maila ani innych danych osobowych.</div></section></div>`}
function inbox(){const map=new Map();state.messages.forEach(m=>{const id=String(m.JOB_ID||m.OFFER_ID||'');if(id)map.set(id,m)});const rows=[...map.values()].reverse();return `<div class="wrap"><section class="card"><h2>💬 Czat</h2><p class="small">Wspólne rozmowy ofert. Każdy czat może mieć wielu uczestników z telefonu i komputera.</p>${rows.length?rows.map(m=>{const x=state.market.find(z=>z.ID===String(m.JOB_ID||m.OFFER_ID));return x?`<button class="ghost full" data-thread="${x.ID}" style="text-align:left;margin:6px 0">💬 <b>${esc(x.TYTUL)}</b> · ${state.chatCounts[x.ID]||1} os.<br><span class="small">${esc(m.TEKST)}</span></button>`:''}).join(''):'<div class="empty">Brak rozmów.</div>'}</section></div>`}
function profile(){return `<div class="wrap"><section class="card"><h2>👤 ${esc(state.login)}</h2><p class="meta">Tymczasowy profil WorkHub · ${roleName()}</p><button class="ghost full" id="changeProfile">Zmień login / charakter</button></section></div>`}
function roleName(){return {WORK:'Szukam pracy / zleceń',BUY:'Potrzebuję / kupię',SELL:'Oferuję / sprzedam',BROWSE:'Przeglądam wszystko'}[state.role]||'Przeglądam wszystko'}
function modal(){if(!state.onboarded||!state.locationPrompt)return '';return `<div class="modal"><div class="modalbox"><h2>📍 Potwierdź lokalizację</h2><p>WorkHub pokaże wszystkie aktywne oferty w domyślnym promieniu <b>${state.radius} km</b> od Twojego położenia.</p><p class="small">Lokalizacja służy do obliczenia odległości. Nie prosimy o adres ani dane biometryczne.</p><button class="primary full" id="confirm">${state.locationBusy?'Pobieram lokalizację…':'📍 Tak, pokaż oferty w okolicy'}</button><button class="ghost full" id="later" style="margin-top:8px">Nie teraz — użyję miejscowości</button></div></div>`}
function nav(){return `<nav class="bottom"><button data-nav="home">🏠<br>Start</button><button data-nav="add">＋<br>Dodaj</button><button data-nav="favorites">⭐<br>Obserw.</button><button data-nav="inbox">💬<br>Czat</button><button data-nav="profile">👤<br>Profil</button></nav>`}
function render(){let content=!state.onboarded?welcome():state.view==='home'?home():state.view==='add'?add():state.view==='detail'?detail():state.view==='chat'?chat():state.view==='favorites'?favorites():state.view==='inbox'?inbox():profile();document.getElementById('app').innerHTML=content+(state.onboarded?nav():'')+modal();bind()}
function favorites(){const a=state.market.filter(x=>state.favorites.includes(x.ID));return `<div class="wrap"><section class="card"><h2>⭐ Obserwowane</h2>${a.length?a.map(card).join(''):'<div class="empty">Nie obserwujesz jeszcze żadnej oferty.</div>'}</section></div>`}
function bind(){
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.login=(document.getElementById('login')?.value||state.login||'').trim().replace(/\s+/g,' ');state.role=b.dataset.role;save();render()});
const loginInput=document.getElementById('login');if(loginInput)loginInput.oninput=()=>{state.login=loginInput.value;save()};
const enter=document.getElementById('enter');if(enter)enter.onclick=async()=>{const v=(document.getElementById('login').value||'').trim().replace(/\s+/g,' ');if(v.length<3)return alert('Login powinien mieć co najmniej 3 znaki.');state.login=v;state.onboarded=true;state.side=state.role==='SELL'?'SELL':state.role==='BROWSE'?'ALL':'BUY';state.locationPrompt=true;save();render();try{await backend('registerGuest',{guestId,login:state.login,role:state.role})}catch{}};
const confirm=document.getElementById('confirm');if(confirm)confirm.onclick=()=>getLocation();
const later=document.getElementById('later');if(later)later.onclick=()=>{state.locationPrompt=false;save();render()};
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.item=null;render()});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.item=b.dataset.open;state.view='detail';state.chatDraft='';state.chatSending=false;render()});
document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{state.item=b.dataset.thread;state.view='chat';state.chatDraft='';state.chatSending=false;state.chatJoining=false;render()});
document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=async()=>{const id=String(b.dataset.fav),on=!state.favorites.includes(id);state.favorites=on?[...state.favorites,id]:state.favorites.filter(x=>x!==id);save();render();try{await backend('favorite',{guestId,itemId:id,on})}catch{}});
document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{state.side=b.dataset.side;state.search='';state.area='';save();render()});
const quickOffer=document.getElementById('quickOffer');if(quickOffer)quickOffer.onclick=()=>{state.side='SELL';state.view='add';save();render()};
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{state.kind=b.dataset.kind;render()});
document.querySelectorAll('[data-formside]').forEach(b=>b.onclick=()=>{state.side=b.dataset.formside;render()});
const search=document.getElementById('search');if(search)search.onclick=()=>{state.search=document.getElementById('q').value;state.area=document.getElementById('area').value;render()};
const rad=document.getElementById('rad');if(rad)rad.oninput=e=>{state.radius=+e.target.value;save();render()};
const refresh=document.getElementById('refresh');if(refresh)refresh.onclick=()=>sync();const retry=document.getElementById('retrySync');if(retry)retry.onclick=()=>sync();
const join=document.getElementById('joinChat');if(join)join.onclick=joinChat;const open=document.getElementById('openChat');if(open)open.onclick=()=>{state.view='chat';state.chatDraft='';state.chatSending=false;render()};
const msg=document.getElementById('msg');if(msg)msg.oninput=()=>{state.chatDraft=msg.value;save()};
const send=document.getElementById('send');if(send)send.onclick=sendMsg;
const publish=document.getElementById('publish');if(publish)publish.onclick=publishItem;
const emptyAdd=document.getElementById('emptyAdd');if(emptyAdd)emptyAdd.onclick=()=>{state.view='add';render()};
const change=document.getElementById('changeProfile');if(change)change.onclick=()=>{state.onboarded=false;save();render()};
}
async function getLocation(){if(!navigator.geolocation)return;state.locationBusy=true;render();navigator.geolocation.getCurrentPosition(p=>{state.lat=p.coords.latitude;state.lng=p.coords.longitude;state.locationPrompt=false;state.locationBusy=false;save();render()},()=>{state.locationBusy=false;render();alert('Nie udało się pobrać lokalizacji. Sprawdź zgodę przeglądarki.')},{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}
async function sync(){if(state.syncing)return;state.syncing=true;state.backendError='';render();try{let r=await backend('ping',{});state.backendVersion=String(r.status||'');r=await backend('list',{guestId});mergeMarket(r);mergeMessages(r.messages);state.favorites=[...new Set([...state.favorites,...(r.favorites||[]).map(x=>String(x.ITEM_ID||x))])];state.joinedItems=[...new Set((r.joinedItems||[]).map(String))];state.chatCounts=r.chatCounts||{};state.backendOk=true;save()}catch(e){state.backendOk=false;state.backendError=e.message||'Nieznany błąd';save()}finally{state.syncing=false;render()}}
async function joinChat(){if(state.chatJoining)return;const x=state.market.find(z=>z.ID===String(state.item));if(!x)return;state.chatJoining=true;save();render();try{const r=await backend('joinChat',{guestId,itemId:x.ID});if(!r?.joined)throw new Error('Baza nie potwierdziła dołączenia.');if(!state.joinedItems.includes(x.ID))state.joinedItems.push(x.ID);state.chatCounts[x.ID]=r.count||state.chatCounts[x.ID]||1;state.chatJoining=false;state.chatDraft='';save();state.view='chat';render();await sync()}catch(e){state.chatJoining=false;save();render();alert('Nie udało się dołączyć do czatu: '+e.message)}}
async function publishItem(){const title=document.getElementById('title').value.trim(),desc=document.getElementById('desc').value.trim();if(!title||!desc)return alert('Uzupełnij tytuł i opis.');const kind=document.getElementById('kind').value;const d={side:state.side==='SELL'?'SELL':'BUY',kind,title,cat:document.getElementById('cat').value,area:document.getElementById('addarea').value.trim(),price:document.getElementById('price').value,when:document.getElementById('when').value,desc,lat:state.lat,lng:state.lng,guestId,qrId:new URLSearchParams(location.search).get('qr')||'',qrPoint:'',author:state.login};try{const r=await backend('createMarket',d);state.market.unshift(norm({...d,ID:r.id,GUEST_ID:guestId,STATUS:'open'},d.side,d.kind));save();state.view='home';render();}catch(e){alert('Nie udało się opublikować: '+e.message)}}
async function sendMsg(){
 const input=document.getElementById('msg'),x=state.market.find(z=>z.ID===String(state.item)),text=(input?.value||'').trim();
 if(!text||!x||state.chatSending)return;
 state.chatDraft=text;state.chatSending=true;save();render();
 const temp={ID:'PENDING_'+Date.now(),JOB_ID:x.ID,OFFER_ID:x.ID,THREAD:'ITEM:'+x.ID,TEKST:text,GUEST_ID:guestId,TO_GUEST_ID:x.GUEST_ID||'',AUTOR:state.login||'Gość',UTWORZONO:new Date().toISOString(),PENDING:true};
 state.messages.push(temp);save();render();
 try{
   const r=await backend('sendMessage',{guestId,toGuestId:'',itemId:x.ID,text,author:state.login||'Gość'});
   if(!r?.id)throw new Error('Baza nie potwierdziła zapisu.');
   state.messages=state.messages.map(m=>String(m.ID)===temp.ID?{...m,ID:r.id,TO_GUEST_ID:r.toGuestId||temp.TO_GUEST_ID,PENDING:false,SENT_OK:true}:m);
   state.chatDraft='';state.chatSending=false;save();render();
   setTimeout(()=>sync(),500);
 }catch(e){
   state.messages=state.messages.map(m=>String(m.ID)===temp.ID?{...m,PENDING:false,SENT_OK:false,SEND_ERROR:true}:m);
   state.chatSending=false;save();render();
 }
}
load();if(!state.onboarded){state.locationPrompt=false}render();sync();setInterval(sync,20000);
</script>
</body>
</html>
