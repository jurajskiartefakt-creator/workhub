<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1530"><title>WorkHub</title><!-- WorkHub 2.0 mobile-search-fix --><style>
:root{--blue:#2864e8;--navy:#0b1530;--bg:#f4f7fb;--text:#16233b;--muted:#667085;--green:#178044;--line:#dce4ef;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:14px;padding:13px 17px;font-weight:800;cursor:pointer}.top{background:var(--navy);color:#fff;padding:28px max(20px,calc((100% - 900px)/2));border-radius:0 0 26px 26px}.top h1{margin:0;font-size:30px}.top p{margin:5px 0 0;color:#c6d0e5}.wrap{max-width:900px;margin:0 auto;padding:20px 16px 100px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #13213b0b}.search{position:static;z-index:5;background:var(--bg);padding:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.search{position:static}.wrap{padding-bottom:120px}.nav button{min-width:0;flex:1;padding:10px 4px;font-size:14px}.card{padding:15px}.actions button{flex:1;min-width:135px}.item{padding:14px}}label{display:block;font-weight:800;margin:9px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;color:var(--text)}textarea{min-height:110px}.primary{background:var(--blue);color:white}.ghost{background:#edf3ff;color:#244f9e}.green{background:#e9f8ef;color:#14743d}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf3ff;color:#2855a4;font-size:13px;font-weight:800;margin:3px}.meta{color:var(--muted);font-size:14px}.price{font-size:21px;color:var(--green);font-weight:900;float:right}.item{border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;background:#fff}.item h3{margin:0 0 6px;font-size:19px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button.active{background:var(--blue);color:#fff}.small{font-size:12px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.nav button{border-radius:0;background:#fff;color:#647084;min-width:95px;padding:10px 8px}.nav button.active{color:var(--blue)}.chat{height:55vh;overflow:auto;background:#f6f8fc;border-radius:16px;padding:12px}.bubble{max-width:78%;padding:11px 14px;border-radius:16px;margin:8px 0}.mine{margin-left:auto;background:#dce8ff}.theirs{background:#fff;border:1px solid var(--line)}.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.danger{color:#b42318}.notice{background:#fff8dc;border:1px solid #f0d879;padding:12px;border-radius:14px}.range{width:100%}
.location-overlay{position:fixed;inset:0;background:#0b1530cc;display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.location-modal{width:min(520px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0005}.location-modal h2{margin:0 0 10px;font-size:24px}.location-modal p{color:var(--muted);line-height:1.5}.location-modal .actions{margin-top:18px}.location-modal .actions button{flex:1;min-width:150px}</style></head><body><header class="top"><h1>WORKHUB</h1><p>Lokalny rynek usług i towarów. Anonimowo. Blisko Ciebie.</p></header><main class="wrap" id="app"></main><nav class="nav"><button data-nav="home">🏠<br>Start</button><button data-nav="add">＋<br>Dodaj</button><button data-nav="favorites">⭐<br>Obserw.</button><button data-nav="chat">💬<br>Czat</button><button data-nav="profile">👤<br>Profil</button></nav>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbw_SxYnRGlUWk6iMHemDNWXcdO16VQgqKbvCkzycT58l1oW4dQngR_glPfa3YW68CWv/exec';
const GUEST_KEY='workhub_guest_v2';const STATE_KEY='workhub_market_v3';
const state={market:[],messages:[],favorites:[],lat:null,lng:null,accuracy:null,search:'',radius:10,kind:'ALL',side:'ALL',area:'',view:'home',item:null,toast:'',syncing:false,backendOk:false,sendBusy:false,locationConfirmed:false,locationPrompt:true,locationBusy:false};
let guestId=localStorage.getItem(GUEST_KEY);if(!guestId){guestId='G'+crypto.randomUUID().replaceAll('-','').slice(0,20).toUpperCase();localStorage.setItem(GUEST_KEY,guestId)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveLocal(){try{localStorage.setItem(STATE_KEY,JSON.stringify({market:state.market,messages:state.messages,favorites:state.favorites,lat:state.lat,lng:state.lng,accuracy:state.accuracy,radius:state.radius}))}catch{}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STATE_KEY)||'{}');state.market=Array.isArray(x.market)?x.market:[];state.messages=Array.isArray(x.messages)?x.messages:[];state.favorites=Array.isArray(x.favorites)?x.favorites.map(String):[];state.lat=x.lat??null;state.lng=x.lng??null;state.accuracy=x.accuracy??null;if(Number(x.radius)>=1)state.radius=Number(x.radius);if(state.lat!==null&&state.lng!==null)state.locationConfirmed=true}catch{}}
function backend(action,data={}){return new Promise((resolve,reject)=>{const cb='whcb_'+Date.now()+'_'+Math.random().toString(36).slice(2);let done=false;const finish=(fn,v)=>{if(done)return;done=true;delete window[cb];try{script.remove()}catch{};fn(v)};window[cb]=(r)=>r&&r.ok?finish(resolve,r):finish(reject,new Error(r?.error||'Backend error'));const script=document.createElement('script');script.src=BACKEND_URL+'?action='+encodeURIComponent(action)+'&callback='+cb+'&data='+encodeURIComponent(JSON.stringify(data));script.onerror=()=>finish(reject,new Error('Brak połączenia z bazą'));document.body.appendChild(script);setTimeout(()=>finish(reject,new Error('Przekroczono czas odpowiedzi')),12000)})}
function cleanText(s){return String(s??'').toLowerCase().replace(/ł/g,'l').replace(/ą/g,'a').replace(/ę/g,'e').replace(/ś/g,'s').replace(/ć/g,'c').replace(/ż/g,'z').replace(/ź/g,'z').replace(/ń/g,'n').replace(/ó/g,'o').replace(/[^a-z0-9]+/g,' ').trim()}
const SYN={
 hydraulik:['hydraulik','hydraulika','hydrauliczne','hydrauliczny','wod kan','wodkan','kran','bateria','zlew','zawor','rura','rury','przeciek','cieknie','cieknacy','cieknaca'],
 kran:['kran','krany','bateria','zlew','zawor','rura','przeciek','cieknie','hydraulik'],
 elektryk:['elektryk','elektryka','elektryczne','prad','gniazdko','gniazdka','instalacja','oswietlenie'],
 malarz:['malarz','malowanie','malowac','farba','sciany','sciana','tapetowanie'],
 ogrodnik:['ogrodnik','ogrod','koszenie','trawa','trawnik','zywoplot','przycinanie'],
 transport:['transport','przewoz','przeprowadzka','bus','laweta','przewozenie'],
 sprzatanie:['sprzatanie','sprzatac','czyszczenie','porzadki','mycie'],
 komputer:['komputer','informatyk','laptop','pc','drukarka','wifi','internet','siec'],
 rower:['rower','rowery','serwis rowerowy','opona','hamulec','lancuch'],
 remont:['remont','budowa','budowlane','glazura','plytki','tynk','gips','montaz']
};
function expandQuery(q){const toks=cleanText(q).split(/\s+/).filter(Boolean);const out=new Set(toks);for(const t of toks){if(SYN[t])SYN[t].forEach(v=>out.add(cleanText(v)));for(const [k,vals] of Object.entries(SYN)){if(vals.some(v=>cleanText(v).includes(t)||t.includes(cleanText(v)))){out.add(k);vals.forEach(v=>out.add(cleanText(v)))}}}return [...out].filter(Boolean)}
function normalizeItem(x,sideHint,kindHint){const y={...x};y.ID=String(y.ID??y.id??'');y.SIDE=(y.SIDE||sideHint)==='SELL'?'SELL':'BUY';y.KIND=(y.KIND||kindHint)==='PRODUCT'?'PRODUCT':'SERVICE';y.TYTUL=y.TYTUL??y.title??y.NAZWA??'';y.KATEGORIA=y.KATEGORIA??y.cat??y.KATEGORIA??'';y.OBSZAR=y.OBSZAR??y.area??'';y.CENA=y.CENA??y.price??'';y.TERMIN=y.TERMIN??y.when??y.DOSTĘPNOŚĆ??'';y.OPIS=y.OPIS??y.desc??'';y.STATUS=String(y.STATUS??'open').toLowerCase();y.GUEST_ID=String(y.GUEST_ID??y.guestId??'');y.LAT=y.LAT??y.lat??null;y.LNG=y.LNG??y.lng??null;return y}
function mergeMarket(r){const incoming=[];if(Array.isArray(r.market))incoming.push(...r.market.map(x=>normalizeItem(x)));if(Array.isArray(r.jobs))incoming.push(...r.jobs.map(x=>normalizeItem(x,'BUY','SERVICE')));if(Array.isArray(r.offers))incoming.push(...r.offers.map(x=>normalizeItem(x,'SELL','SERVICE')));const by=new Map();for(const x of incoming){if(x.ID)by.set(String(x.ID),x)}for(const x of state.market){if(x.ID&&!by.has(String(x.ID)))by.set(String(x.ID),normalizeItem(x))}state.market=[...by.values()];}
function mergeMessages(remote){const by=new Map(state.messages.map(m=>[String(m.ID||m.id||''),m]));for(const m of (remote||[])){const id=String(m.ID||m.id||'');if(id)by.set(id,m)}state.messages=[...by.values()].sort((a,b)=>String(a.UTWORZONO||'').localeCompare(String(b.UTWORZONO||'')));}
function mergeFavorites(remote){const s=new Set(state.favorites.map(String));for(const x of (remote||[])){if(typeof x==='string')s.add(x);else if(x?.ITEM_ID)s.add(String(x.ITEM_ID));}state.favorites=[...s]}
async function sync(silent=false){if(state.syncing)return;state.syncing=true;if(!silent)render();try{const r=await backend('list',{guestId});mergeMarket(r);mergeMessages(r.messages);mergeFavorites(r.favorites);state.backendOk=true;saveLocal();}catch(e){state.backendOk=false;console.warn(e)}finally{state.syncing=false;render()}}
function toast(t){state.toast=t;render();setTimeout(()=>{state.toast='';render()},2600)}
function dist(a,b,c,d){if([a,b,c,d].some(x=>x==null||x===''||isNaN(Number(x))))return null;const R=6371,rad=x=>x*Math.PI/180,dLat=rad(c-a),dLon=rad(d-b);const q=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(false);state.locationBusy=true;render();navigator.geolocation.getCurrentPosition(p=>{state.lat=p.coords.latitude;state.lng=p.coords.longitude;state.accuracy=p.coords.accuracy;state.locationConfirmed=true;state.locationPrompt=false;state.locationBusy=false;saveLocal();render();res(true)},()=>{state.locationBusy=false;render();res(false)},{enableHighAccuracy:true,timeout:12000,maximumAge:60000})})}
function searchable(x){return cleanText([x.TYTUL,x.KATEGORIA,x.OBSZAR,x.OPIS,x.CENA,x.TERMIN,x.KIND,x.SIDE].join(' '))}
function match(x){if(String(x.STATUS||'open').toLowerCase()==='closed')return false;const q=state.search.trim();if(q){const hay=searchable(x);const terms=expandQuery(q);if(!terms.some(t=>hay.includes(t)))return false}if(state.kind!=='ALL'&&x.KIND!==state.kind)return false;if(state.side!=='ALL'&&x.SIDE!==state.side)return false;if(state.area.trim()&&!cleanText(x.OBSZAR).includes(cleanText(state.area)))return false;const d=dist(state.lat,state.lng,x.LAT,x.LNG);x.__distance=d;if(state.lat!==null&&state.lng!==null&&d!==null&&d>state.radius&&!state.favorites.includes(x.ID))return false;return true}
function card(x){const d=x.__distance;const fav=state.favorites.includes(String(x.ID));return `<article class="item"><div class="row"><h3>${x.SIDE==='BUY'?'🛒':'🏷️'} ${esc(x.TYTUL||'Bez tytułu')}</h3><span class="price">${esc(x.CENA||'do uzgodnienia')}</span></div><div><span class="pill">${x.SIDE==='BUY'?'POTRZEBUJĘ':'OFERUJĘ'}</span><span class="pill">${x.KIND==='PRODUCT'?'TOWAR':'USŁUGA'}</span><span class="pill">${esc(x.KATEGORIA||'inne')}</span></div><div class="meta">📍 ${esc(x.OBSZAR||'brak lokalizacji')} ${d!==null?`· ${d.toFixed(1)} km`:''} · 🕐 ${esc(x.TERMIN||'do uzgodnienia')}</div><p>${esc(x.OPIS||'')}</p><div class="actions"><button class="primary" data-open="${esc(x.ID)}">Zobacz ofertę</button><button class="ghost" data-fav="${esc(x.ID)}">${fav?'★ Obserwujesz':'☆ Obserwuj'}</button></div></article>`}
function home(){const results=state.market.filter(match).sort((a,b)=>(a.__distance??99999)-(b.__distance??99999)||String(b.UTWORZONO||'').localeCompare(String(a.UTWORZONO||'')));const status=state.syncing?'🔄 Łączenie ze wspólną bazą…':state.backendOk?'🟢 Wspólna baza połączona':'🟡 Tryb lokalny — brak połączenia z bazą';return `<section class="search"><div class="card"><h2>🔎 Znajdź w okolicy</h2><div class="small">${status}</div><div class="grid"><div><label>Czego szukasz?</label><input id="q" value="${esc(state.search)}" placeholder="np. hydraulik, kran, koszenie, rower..."></div><div><label>Gdzie?</label><input id="area" value="${esc(state.area)}" placeholder="np. Zawiercie, Poręba..."></div></div><label>Promień: <b>${state.radius} km</b></label><input class="range" id="radius" type="range" min="1" max="50" value="${state.radius}"><div class="actions"><button class="primary" id="doSearch">🔎 SZUKAJ</button><button class="ghost" id="loc">📍 ${state.lat!==null?'Moja lokalizacja ustawiona':'Użyj mojej lokalizacji'}</button><button class="ghost" id="refresh">🔄 Odśwież</button><button class="ghost" id="clear">Wyczyść</button></div><div class="tabs" style="margin-top:12px"><button class="${state.side==='ALL'?'active':''}" data-side="ALL">Wszystko</button><button class="${state.side==='BUY'?'active':''}" data-side="BUY">🛒 Potrzebuję</button><button class="${state.side==='SELL'?'active':''}" data-side="SELL">🏷️ Oferuję</button><button class="${state.kind==='PRODUCT'?'active':''}" data-kind="PRODUCT">📦 Towary</button></div><div class="small">Po potwierdzeniu lokalizacji WorkHub pokazuje wszystkie oferty w ustawionym promieniu. Wspólny strumień pokazuje potrzeby i oferty razem. Obserwowane pozostają dostępne także poza promieniem.</div></div></section><div class="card" id="results"><div class="row"><h2>📍 Oferty w okolicy</h2><span class="pill">${results.length} wynik${results.length===1?'':results.length<5?'i':'ów'}</span></div>${results.length?results.map(card).join(''):state.syncing?'<p class="meta">Pobieram oferty ze wspólnej bazy…</p>':'<p class="meta">Brak ofert spełniających warunki. Spróbuj „kran”, „hydraulik”, nazwę miejscowości albo zwiększ promień.</p>'}</div>`}
function add(){return `<div class="card"><div class="tabs"><button class="${state.side!=='SELL'?'active':''}" data-formside="BUY">🛒 Kupuję / potrzebuję</button><button class="${state.side==='SELL'?'active':''}" data-formside="SELL">🏷️ Sprzedaję / oferuję</button></div><h2>Dodaj ofertę</h2><div class="grid"><div><label>Co?</label><input id="title" placeholder="np. Potrzebuję hydraulika"></div><div><label>Rodzaj</label><select id="kind"><option value="SERVICE">Usługa</option><option value="PRODUCT">Towar</option></select></div></div><label>Kategoria</label><input id="cat" placeholder="np. Naprawy, transport, ogród..."><label>Gdzie?</label><input id="aarea" value="Zawiercie"><div class="grid"><div><label>Cena / budżet</label><input id="price" placeholder="np. 100–150 zł"></div><div><label>Termin / dostępność</label><input id="when" placeholder="np. dzisiaj po 17:00"></div></div><label>Opis</label><textarea id="desc" placeholder="Szczegóły oferty..."></textarea><div class="notice">🔐 Oferta jest publiczna w strumieniu, ale Twój identyfikator pozostaje pseudonimowy.</div><button class="primary" id="publish">Opublikuj ofertę</button></div>`}
function findItem(){return state.market.find(i=>String(i.ID)===String(state.item))}
function detail(){const x=findItem();if(!x)return `<div class="card"><h2>Nie znaleziono oferty</h2><button class="primary" data-nav="home">Wróć</button></div>`;const mine=x.GUEST_ID===guestId;return `<div class="card"><button class="ghost" data-nav="home">← Wróć</button><h2>${x.SIDE==='BUY'?'🛒':'🏷️'} ${esc(x.TYTUL)}</h2><div><span class="pill">${x.SIDE==='BUY'?'POTRZEBUJĘ':'OFERUJĘ'}</span><span class="pill">${x.KIND==='PRODUCT'?'TOWAR':'USŁUGA'}</span><span class="pill">${esc(x.KATEGORIA||'inne')}</span></div><p class="meta">📍 ${esc(x.OBSZAR||'')} · 🕐 ${esc(x.TERMIN||'do uzgodnienia')}</p><h3>${esc(x.CENA||'do uzgodnienia')}</h3><p>${esc(x.OPIS||'')}</p>${mine?'<div class="notice">To Twoja oferta. Inni użytkownicy mogą rozpocząć anonimową rozmowę z Tobą z poziomu tej oferty.</div>':`<div class="actions"><button class="primary" id="openChat">💬 Zainteresowany — rozpocznij anonimowy czat</button><button class="ghost" data-fav="${esc(x.ID)}">${state.favorites.includes(String(x.ID))?'★ Obserwujesz':'☆ Obserwuj'}</button></div>`}</div>`}
function chat(){const x=findItem();if(!x)return `<div class="card"><h2>Wybierz ofertę</h2><button class="primary" data-nav="home">Wróć</button></div>`;const msgs=state.messages.filter(m=>String(m.JOB_ID||m.OFFER_ID||'')===String(x.ID));return `<div class="card"><button class="ghost" data-nav="home">← Wróć</button><h2>💬 Czat</h2><div class="meta">${esc(x.TYTUL)} · 📍 ${esc(x.OBSZAR||'')} · anonimowo</div><div class="chat" id="chatbox">${msgs.length?msgs.map(m=>`<div class="bubble ${String(m.GUEST_ID)===guestId?'mine':'theirs'}"><div>${esc(m.TEKST)}</div><div class="small">${String(m.GUEST_ID)===guestId?'Ty':'Gość WorkHub'}</div></div>`).join(''):'<p class="meta">Rozpocznij rozmowę. Druga strona nie zobaczy Twoich danych osobowych.</p>'}</div><div class="actions"><input id="msg" placeholder="Napisz wiadomość..." ${state.sendBusy?'disabled':''}><button class="primary" id="send" ${state.sendBusy?'disabled':''}>${state.sendBusy?'Wysyłam…':'Wyślij'}</button></div></div>`}
function favorites(){const items=state.market.filter(x=>state.favorites.includes(String(x.ID)));return `<div class="card"><h2>⭐ Obserwowane</h2><p class="meta">Obserwowane oferty pozostają widoczne nawet po wyjściu poza ich aktualny promień.</p>${items.length?items.map(card).join(''):'<p class="meta">Nie obserwujesz jeszcze żadnej oferty.</p>'}</div>`}
function profile(){return `<div class="card"><h2>👤 Twój WorkHub</h2><p>Interfejsowo jesteś anonimowy.</p><div class="notice">Twój pseudonimowy identyfikator:<br><b>${esc(guestId)}</b></div><p class="meta">WorkHub nie powinien przechowywać biometrii. Docelowo mocniejsza ciągłość tożsamości może korzystać z passkey/WebAuthn.</p><button class="primary" id="sync">🔄 Synchronizuj bazę</button><button class="ghost" id="geo">📍 Ustaw lokalizację</button></div>`}
function locationPromptHtml(){if(!state.locationPrompt)return '';return `<div class="location-overlay"><div class="location-modal"><h2>📍 Potwierdź swoją lokalizację</h2><p>WorkHub może użyć lokalizacji Twojego urządzenia, aby od razu pokazać <b>wszystkie aktualne oferty w ustawionym promieniu ${state.radius} km</b>.</p><p>Nie zapisujemy adresu ani danych biometrycznych. Aplikacja potrzebuje jedynie współrzędnych do obliczenia odległości od ofert.</p><div class="actions"><button class="primary" id="confirmLocation" ${state.locationBusy?'disabled':''}>${state.locationBusy?'📍 Pobieram lokalizację…':'📍 Tak, pokaż oferty w okolicy'}</button><button class="ghost" id="skipLocation" ${state.locationBusy?'disabled':''}>Nie teraz</button></div></div></div>`}
function render(){const app=document.getElementById('app');let html=state.view==='home'?home():state.view==='add'?add():state.view==='detail'?detail():state.view==='chat'?chat():state.view==='favorites'?favorites():profile();if(state.toast)html=`<div class="notice">${esc(state.toast)}</div>`+html;app.innerHTML=html+locationPromptHtml();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav==='favorites'?'favorites':b.dataset.nav;state.item=null;render()});document.querySelectorAll('.nav [data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.view));bind();if(state.view==='chat'){const box=document.getElementById('chatbox');if(box)box.scrollTop=box.scrollHeight}}
function bind(){const confirmLocation=document.getElementById('confirmLocation');if(confirmLocation)confirmLocation.onclick=async()=>{const ok=await getPos();if(!ok){state.locationPrompt=true;toast('Nie udało się pobrać lokalizacji. Sprawdź zgodę na lokalizację w przeglądarce.')}};const skipLocation=document.getElementById('skipLocation');if(skipLocation)skipLocation.onclick=()=>{state.locationPrompt=false;render()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.item=b.dataset.open;state.view='detail';render()});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=async()=>{const id=String(b.dataset.fav),on=!state.favorites.includes(id);if(on)state.favorites.push(id);else state.favorites=state.favorites.filter(x=>x!==id);saveLocal();render();try{await backend('favorite',{guestId,itemId:id,on});state.backendOk=true}catch(e){toast('Nie udało się zapisać obserwowanej oferty.')}});document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{state.side=b.dataset.side;render()});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{state.kind=b.dataset.kind;render()});document.querySelectorAll('[data-formside]').forEach(b=>b.onclick=()=>{state.side=b.dataset.formside;render()});const q=document.getElementById('q'),ar=document.getElementById('area'),doSearch=document.getElementById('doSearch');if(doSearch)doSearch.onclick=()=>{state.search=q?.value||'';state.area=ar?.value||'';render();setTimeout(()=>document.getElementById('results')?.scrollIntoView({behavior:'smooth',block:'start'}),50)};if(q)q.onkeydown=e=>{if(e.key==='Enter'){state.search=q.value;state.area=ar?.value||'';render()}};if(ar)ar.onkeydown=e=>{if(e.key==='Enter'){state.search=q?.value||'';state.area=ar.value;render()}};const rr=document.getElementById('radius');if(rr)rr.oninput=e=>{state.radius=Number(e.target.value);render()};const loc=document.getElementById('loc');if(loc)loc.onclick=async()=>{const ok=await getPos();toast(ok?'Lokalizacja ustawiona.':'Nie udało się pobrać lokalizacji. Możesz użyć miejscowości.');};const refresh=document.getElementById('refresh');if(refresh)refresh.onclick=()=>sync();const clear=document.getElementById('clear');if(clear)clear.onclick=()=>{state.search='';state.area='';state.side='ALL';state.kind='ALL';render()};const open=document.getElementById('openChat');if(open)open.onclick=()=>{state.view='chat';render()};const send=document.getElementById('send');if(send)send.onclick=sendMsg;const msg=document.getElementById('msg');if(msg)msg.onkeydown=e=>{if(e.key==='Enter')sendMsg()};const pub=document.getElementById('publish');if(pub)pub.onclick=publish;const syncBtn=document.getElementById('sync');if(syncBtn)syncBtn.onclick=()=>sync();const geo=document.getElementById('geo');if(geo)geo.onclick=()=>getPos().then(()=>toast('Lokalizacja ustawiona.'))}
async function publish(){const title=document.getElementById('title')?.value.trim(),desc=document.getElementById('desc')?.value.trim();if(!title||!desc)return toast('Uzupełnij tytuł i opis.');const d={side:state.side==='SELL'?'SELL':'BUY',kind:document.getElementById('kind').value,title,cat:document.getElementById('cat').value,area:document.getElementById('aarea').value,price:document.getElementById('price').value,when:document.getElementById('when').value,desc,lat:state.lat,lng:state.lng,guestId,qrId:new URLSearchParams(location.search).get('qr')||'',qrPoint:''};try{const r=await backend('createMarket',d);const item=normalizeItem({...d,ID:r.id,STATUS:'open',UTWORZONO:new Date().toISOString(),GUEST_ID:guestId},d.side,d.kind);state.market=[item,...state.market.filter(x=>String(x.ID)!==String(item.ID))];state.backendOk=true;saveLocal();state.view='home';toast('Oferta została opublikowana.');render()}catch(e){toast('Nie udało się opublikować: '+e.message)}}
async function sendMsg(){if(state.sendBusy)return;const input=document.getElementById('msg'),text=input?.value.trim(),x=findItem();if(!text||!x)return;state.sendBusy=true;const temp={ID:'TEMP'+Date.now(),THREAD:'ITEM:'+x.ID,JOB_ID:x.ID,OFFER_ID:x.ID,TEKST:text,GUEST_ID:guestId,AUTOR:'Gość WorkHub',TO_GUEST_ID:x.GUEST_ID||'',UTWORZONO:new Date().toISOString()};state.messages.push(temp);saveLocal();render();try{const r=await backend('sendMessage',{guestId,toGuestId:x.GUEST_ID,itemId:x.ID,text,author:'Gość WorkHub'});const i=state.messages.findIndex(m=>String(m.ID)===String(temp.ID));if(i>=0)state.messages[i]={...temp,ID:r.id,TO_GUEST_ID:r.toGuestId||temp.TO_GUEST_ID};state.backendOk=true;saveLocal();toast('Wiadomość zapisana w czacie.')}catch(e){toast('Wiadomość została zachowana lokalnie, ale nie zapisano jej w bazie: '+e.message)}finally{state.sendBusy=false;render()}}
loadLocal();state.market=state.market.map(x=>normalizeItem(x));state.locationPrompt=!(state.lat!==null&&state.lng!==null);render();sync(true);if(state.locationPrompt)requestAnimationFrame(()=>render());setInterval(()=>sync(true),20000);backend('registerGuest',{guestId}).catch(()=>{});
</script></body></html>
