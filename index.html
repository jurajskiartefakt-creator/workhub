<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>WorkHub v14 — lokalny marketplace</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#667085;--line:#e4e9f0;--blue:#2563eb;--green:#16a34a;--dark:#0b1220;--soft:#eef4ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0b1220,#172554);color:#fff;padding:22px 18px 28px;border-radius:0 0 24px 24px}
.logo{font-size:28px;font-weight:800;letter-spacing:-.7px}.tag{opacity:.8;margin-top:3px;font-size:13px}
main{max-width:760px;margin:auto;padding:16px 14px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #0b122008}
h1{font-size:27px}h2,h3{margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:13px;padding:13px 14px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:var(--soft);color:#1744a2}.green{background:#eaf8ef;color:#08752f}.dark{background:var(--dark);color:#fff}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:5px 0 10px;background:#fff}textarea{min-height:90px;resize:vertical}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:7px env(safe-area-inset-right) calc(7px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.nav button{background:none;color:var(--muted);font-size:12px;padding:8px 15px}.nav button.active{color:var(--blue)}
.job{border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:99px;background:#eef2f7;color:#4b5563}.price{font-weight:800;color:#0f7a35}
.chat{height:48vh;overflow:auto;background:#f7f9fc;border-radius:14px;padding:12px}.msg{max-width:82%;padding:10px 12px;border-radius:14px;margin:7px 0;font-size:14px}.me{background:#dbeafe;margin-left:auto}.them{background:#fff;border:1px solid var(--line)}
.small{font-size:12px}.hero{text-align:center;padding:12px 4px 4px}.hero h1{margin:0 0 6px}.notice{background:#fff8df;border:1px solid #f4df91;padding:11px;border-radius:12px;font-size:12px}
.qrpreview{display:flex;justify-content:center;padding:18px;background:#fff;border:1px dashed #cbd5e1;border-radius:16px;margin:12px 0}.tag2{display:inline-block;background:#eef4ff;color:#2451a6;border-radius:99px;padding:5px 9px;font-size:11px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#f7f9fc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}
.photo-preview{max-width:100%;max-height:220px;border-radius:14px;border:1px solid var(--line);margin-top:8px;display:none}.qr-action{background:#eff6ff;border:1px solid #bfdbfe;border-radius:16px;padding:14px;margin-top:10px}.hide{display:none!important}.searchbox{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 4px}.chip{white-space:nowrap;background:#fff;border:1px solid var(--line);color:#475467;border-radius:99px;padding:7px 10px;font-size:12px}.chip.active{background:#eaf1ff;color:#1744a2;border-color:#9bbcff}.empty{text-align:center;padding:24px 10px;color:var(--muted)}.offer{border:1px solid #dce7dd;border-radius:15px;padding:14px;margin:9px 0;background:#fbfffc}.badge{display:inline-block;min-width:18px;padding:2px 6px;border-radius:99px;background:#dc2626;color:#fff;font-size:10px;line-height:14px;margin-left:3px;vertical-align:top}.notice-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:#fff}.notice-item.unread{border-color:#93c5fd;background:#f8fbff}.notif-dot{font-size:9px;color:#dc2626}.radiusbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 7px}.result-head h3{margin:0}.homeSearch{background:#f7f9fc;border:1px solid var(--line);border-radius:16px;padding:13px}.guestbox{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.distance{font-size:12px;color:#475467}.danger{background:#fff1f2;color:#b42318}
</style>
</head>
<body>
<header><div class="logo">WORKHUB</div><div class="tag">Lokalne zlecenia. Lokalni ludzie.</div></header>
<main id="app"></main>
<div class="nav">
<button onclick="show('home')" id="n-home">⌂<br>Start</button>
<button onclick="show('jobs')" id="n-jobs">🔧<br>Zlecenia</button>
<button onclick="show('add')" id="n-add">＋<br>Dodaj</button>
<button onclick="show('chat')" id="n-chat">💬<br>Czat</button>
<button onclick="show('notifications')" id="n-notifications">🔔<span id="notifBadge" class="badge hide">0</span><br>Powiadom.</button>
<button onclick="show('profile')" id="n-profile">●<br>Profil</button>
</div>
<script>
// ===== WORKHUB WSPÓLNA BAZA =====
// Po wdrożeniu Google Apps Script wklej tutaj URL Web App.
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw_SxYnRGlUWk6iMHemDNWXcdO16VQgqKbvCkzycT58l1oW4dQngR_glPfa3YW68CWv/exec";
const BACKEND_ENABLED = BACKEND_URL.startsWith("https://script.google.com/");
let backendBusy = false;
function backendCall(action, data){
  return new Promise((resolve,reject)=>{
    if(!BACKEND_ENABLED){resolve({ok:false,disabled:true});return;}
    const cb="whcb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const timer=setTimeout(()=>{cleanup();reject(new Error("Przekroczono czas połączenia z bazą WorkHub."));},12000);
    function cleanup(){clearTimeout(timer);delete window[cb];if(script&&script.parentNode)script.parentNode.removeChild(script)}
    window[cb]=(res)=>{cleanup();resolve(res)};
    const script=document.createElement("script");
    let url=BACKEND_URL+"?action="+encodeURIComponent(action)+"&callback="+encodeURIComponent(cb);
    if(data)url+="&data="+encodeURIComponent(JSON.stringify(data));
    script.src=url;script.onerror=()=>{cleanup();reject(new Error("Nie udało się połączyć z bazą WorkHub."))};
    document.head.appendChild(script);
  });
}
async function syncBackend(showAlert=false){
  if(!BACKEND_ENABLED||backendBusy)return false;
  backendBusy=true;
  try{
    const r=await backendCall("list");
    if(!r||!r.ok)throw new Error(r&&r.error||"Błąd bazy");
    const rawJobs=r.jobs||[], rawOffers=r.offers||[], rawMessages=r.messages||[];
    const oldJobIds=new Set((state.knownRemote.jobs||[]));
    const oldOfferIds=new Set((state.knownRemote.offers||[]));
    const oldMsgIds=new Set((state.knownRemote.messages||[]));
    const firstSync=!state.backendInitialized;
    const jobs=rawJobs.map(x=>({id:x.ID,title:x.TYTUL,cat:x.KATEGORIA,area:x.OBSZAR,price:x.CENA,when:x.TERMIN,desc:x.OPIS,status:x.STATUS||"open",qr:!!x.QR_ID,qrId:x.QR_ID||"",qrPoint:x.QR_PUNKT||"",author:x.AUTOR||"",createdAt:x.UTWORZONO||"",lat:x.LAT,lng:x.LNG,guestId:x.GUEST_ID||"",photo:"",shared:true}));
    const offers=rawOffers.map(x=>({id:x.ID,name:x.NAZWA,service:x.USŁUGA,cat:x.KATEGORIA,area:x.OBSZAR,desc:x.OPIS,availability:x.DOSTĘPNOŚĆ,author:x.AUTOR||"",createdAt:x.UTWORZONO||"",lat:x.LAT,lng:x.LNG,guestId:x.GUEST_ID||"",shared:true}));
    const messages=rawMessages.map(x=>({id:x.ID,thread:x.THREAD,jobId:x.JOB_ID||"",offerId:x.OFFER_ID||"",text:x.TEKST,author:x.AUTOR||"",createdAt:x.UTWORZONO||"",guestId:x.GUEST_ID||"",me:x.AUTOR===state.name,shared:true}));
    const newJobs=firstSync?[]:jobs.filter(j=>!oldJobIds.has(j.id));
    const newOffers=firstSync?[]:offers.filter(o=>!oldOfferIds.has(o.id));
    const newMessages=firstSync?[]:messages.filter(m=>!oldMsgIds.has(m.id) && m.author!==state.name);
    // Nie usuwaj lokalnych danych tylko dlatego, że chwilowo nie ma ich w odpowiedzi backendu.
    // To chroni m.in. zlecenia utworzone przed synchronizacją albo oczekujące na zapis.
    const remoteJobIds=new Set(jobs.map(j=>String(j.id)));
    const remoteOfferIds=new Set(offers.map(o=>String(o.id)));
    const remoteMessageIds=new Set(messages.map(m=>String(m.id)));
    const localJobs=(state.jobs||[]).filter(j=>!remoteJobIds.has(String(j.id)));
    const localOffers=(state.offers||[]).filter(o=>!remoteOfferIds.has(String(o.id)));
    const localMessages=(state.messages||[]).filter(m=>!remoteMessageIds.has(String(m.id)));
    state.jobs=[...jobs,...localJobs];
    state.offers=[...offers,...localOffers];
    state.messages=[...messages,...localMessages];
    state.knownRemote={jobs:jobs.map(j=>j.id),offers:offers.map(o=>o.id),messages:messages.map(m=>m.id)};
    state.backendInitialized=true;
    save();
    // Powiadomienia są kierowane zgodnie z rolą użytkownika, ale pozostają widoczne w historii.
    if(!firstSync){
      if(state.mode==="worker") newJobs.forEach(j=>addNotification("job","🆕 Nowe zlecenie",`${j.title} · ${j.area}${j.price?` · ${j.price}`:""}`,j.id));
      if(state.mode==="client") newOffers.forEach(o=>addNotification("offer","👷 Nowa oferta wykonawcy",`${o.service} · ${o.area} · ${o.name}`,o.id));
      newMessages.forEach(m=>addNotification("message","💬 Nowa wiadomość",`${m.author||"Użytkownik"}: ${m.text}`,m.thread));
    }
    if(showAlert)alert("WorkHub połączony ze wspólną bazą.");
    updateNotifBadge();
    return true;
  }catch(e){console.warn(e);if(showAlert)alert("Baza WorkHub jest chwilowo niedostępna. Aplikacja pozostaje w trybie lokalnym.");return false}
  finally{backendBusy=false}
}
function startPolling(){
  if(!BACKEND_ENABLED)return;
  setInterval(()=>syncBackend(false),30000);
}

const KEY="workhub_v2";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 mode:null,name:"Gość",area:"Zawiercie",qrContext:"",
 jobs:[
 {id:1,title:"Montaż karnisza",cat:"Montaż",area:"Zawiercie",distance:"1,8 km",price:"80–150 zł",when:"Dzisiaj",desc:"Potrzebuję montażu karnisza w salonie.",status:"open"},
 {id:2,title:"Koszenie trawy",cat:"Ogród",area:"Poręba",distance:"6,2 km",price:"120–180 zł",when:"Weekend",desc:"Działka około 500 m².",status:"open"},
 {id:3,title:"Drobna naprawa drzwi",cat:"Naprawy",area:"Zawiercie",distance:"3,1 km",price:"100–200 zł",when:"Do uzgodnienia",desc:"Drzwi wymagają regulacji i poprawienia zawiasu.",status:"open"}
 ],
 offers:[
  {id:101,name:"Marek",service:"Montaż i drobne naprawy",cat:"Montaż",area:"Zawiercie",desc:"Karnisze, półki, uchwyty, drobne prace domowe.",availability:"Popołudnia"},
  {id:102,name:"Ania",service:"Ogród i porządki",cat:"Ogród",area:"Poręba",desc:"Koszenie, przycinanie, porządki na działkach.",availability:"Weekendy"},
  {id:103,name:"Tomek",service:"Transport lokalny",cat:"Transport",area:"Zawiercie",desc:"Mały transport i pomoc przy przewozie rzeczy.",availability:"Do uzgodnienia"}
 ],messages:[],current:null,currentOffer:null,notifications:[],backendInitialized:false,knownRemote:{jobs:[],offers:[],messages:[]},radiusKm:10,coords:null,guestId:""
};
// Uzupełnienie pól dodanych w v10 dla istniejących użytkowników.
state.notifications=Array.isArray(state.notifications)?state.notifications:[];
state.knownRemote=state.knownRemote||{jobs:[],offers:[],messages:[]};
state.backendInitialized=!!state.backendInitialized;
state.currentOffer=state.currentOffer||null;
state.radiusKm=Number(state.radiusKm)||10;
state.coords=state.coords||null;
state.guestId=state.guestId||((crypto&&crypto.randomUUID)?crypto.randomUUID():"G"+Date.now().toString(36)+Math.random().toString(36).slice(2));
save();
function unreadCount(){return state.notifications.filter(n=>!n.read).length}
function updateNotifBadge(){const b=document.getElementById("notifBadge");if(!b)return;const n=unreadCount();b.textContent=n>99?"99+":String(n);b.classList.toggle("hide",n===0)}
function addNotification(type,title,text,ref){
 const n={id:"N"+Date.now()+Math.random().toString(36).slice(2,6),type,title,text,ref:ref||"",read:false,createdAt:new Date().toISOString()};
 state.notifications.unshift(n);
 state.notifications=state.notifications.slice(0,100);
 save(); updateNotifBadge();
 if(document.visibilityState!=="visible" || type==="message") notifyBrowser(title,text);
}
function notifyBrowser(title,text){
 try{if("Notification" in window && Notification.permission==="granted") new Notification(title,{body:text});}catch(e){}
}
async function enableNotifications(){
 if(!("Notification" in window)){alert("Ta przeglądarka nie obsługuje powiadomień systemowych. Powiadomienia WorkHub w aplikacji nadal będą działać.");return}
 try{const p=await Notification.requestPermission();if(p==="granted")alert("Powiadomienia systemowe WorkHub są włączone.");else alert("Powiadomienia systemowe nie zostały włączone. Powiadomienia w aplikacji nadal będą działać.");}catch(e){alert("Nie udało się włączyć powiadomień systemowych.");}
}
function notifications(){
 const list=state.notifications||[];
 document.getElementById("app").innerHTML=`<div class="card"><div class="row"><div><h2>🔔 Powiadomienia</h2><div class="muted">Nowe zlecenia, oferty wykonawców i wiadomości.</div></div><button class="secondary" onclick="markAllNotificationsRead()">Oznacz jako przeczytane</button></div>
 ${list.length?list.map(n=>`<div class="notice-item ${n.read?"":"unread"}" onclick="openNotification('${esc(n.id)}')"><div class="row"><b>${esc(n.title)}</b><span class="small muted">${n.read?"":"NOWE"}</span></div><div class="small" style="margin-top:5px">${esc(n.text)}</div></div>`).join(""):`<div class="empty">Brak powiadomień.</div>`}</div>
 <div class="card"><h3>📲 Powiadomienia systemowe</h3><div class="muted">Jeśli chcesz, WorkHub może pokazywać powiadomienia przeglądarki, gdy aplikacja jest otwarta.</div><br><button class="primary" onclick="enableNotifications()">🔔 Włącz powiadomienia</button></div>`;
 updateNotifBadge();
}
function markAllNotificationsRead(){state.notifications.forEach(n=>n.read=true);save();updateNotifBadge();notifications()}
function openNotification(id){
 const n=state.notifications.find(x=>x.id===id);if(!n)return;
 n.read=true;save();updateNotifBadge();
 if(n.type==="message"){
   state.currentOffer=null;
   if(String(n.ref).startsWith("job:")) state.current=String(n.ref).slice(4);
   if(String(n.ref).startsWith("offer:")){state.current=null;state.currentOffer=String(n.ref).slice(6);}
   save();show("chat");
 }else{show("jobs");}
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(e){
    console.error("WorkHub save error:",e);
    alert("Nie udało się zapisać zlecenia w pamięci telefonu. Spróbujemy zapisać je bez zdjęcia.");
    return false;
  }
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
document.getElementById("app").addEventListener("click",function(e){
 const el=e.target.closest("[data-action]"); if(!el)return;
 const id=el.getAttribute("data-id")||"";
 const action=el.getAttribute("data-action");
 if(action==="open-job"){e.preventDefault();openJob(id)}
 if(action==="open-offer"){e.preventDefault();openOffer(id)}
 if(action==="start-job-chat"){e.preventDefault();startChat(id)}
 if(action==="start-offer-chat"){e.preventDefault();startOfferChat(id)}
});
function show(page){
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 const n=document.getElementById("n-"+page);if(n)n.classList.add("active");
 if(page==="home")home();if(page==="jobs")jobs();if(page==="add")add();if(page==="chat")chat();if(page==="notifications")notifications();if(page==="profile")profile();
}
function qrPoint(){return state.qrContext?({ZAW001:"Punkt WorkHub – Zawiercie",POR001:"Punkt WorkHub – Poręba"}[state.qrContext]||("Punkt WorkHub – "+state.qrContext)):""}
function home(){
 const p=qrPoint();
 const cats=["Wszystko","Naprawy","Montaż","Remont","Ogród","Transport","Sprzątanie","Pomoc techniczna"];
 document.getElementById("app").innerHTML=`
 <div class="hero"><h1>Znajdź zlecenie albo wykonawcę</h1><div class="muted">Jedna wyszukiwarka. Lokalne zlecenia i lokalni wykonawcy.</div></div>
 ${p?`<div class="card" style="border-color:#93c5fd"><span class="tag2">QR AKTYWNY</span><h3>📍 ${esc(p)}</h3><div class="muted">Skanowany punkt zostanie przypisany do nowych zgłoszeń.</div><div class="qr-action"><b>Masz potrzebę w tym miejscu?</b><div class="small" style="margin:5px 0 10px">Dodaj zlecenie bez szukania formularza.</div><button class="primary" onclick="add(true)">⚠️ ZGŁOŚ POTRZEBĘ</button></div></div>`:""}
 <div class="card"><h2>🔎 Szukaj w okolicy</h2>
   <div class="homeSearch">
    <label><b>Czego szukasz?</b></label><input id="homeSearch" value="${esc(state.searchText||"")}" placeholder="hydraulik, kran, koszenie, transport…">
    <label><b>📍 Gdzie?</b></label><input id="homeArea" value="${esc(state.searchArea||state.area||"")}" placeholder="Zawiercie, Poręba, Myszków…">
    <div class="radiusbar"><div><label><b>Promień</b></label><select id="homeRadius"><option value="2">2 km</option><option value="5">5 km</option><option value="10">10 km</option><option value="25">25 km</option><option value="50">50 km</option></select></div><div style="display:flex;align-items:end"><button class="secondary" style="width:100%" onclick="useMyLocation()">📍 Moja lokalizacja</button></div></div>
    <div class="chips" style="margin-top:7px">${cats.map(c=>`<button class="chip ${c==='Wszystko'?'active':''}" data-home-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <button class="primary" style="width:100%;margin-top:8px" onclick="runHomeSearch()">🔎 SZUKAJ</button>
    <div id="homeSearchInfo" class="small muted" style="margin-top:8px">Pokazujemy jednocześnie zlecenia i oferty wykonawców.</div>
   </div>
   <div id="homeResults"></div>
 </div>
 <div class="card"><div class="guestbox"><div class="row"><div><b>👤 Gość WorkHub</b><div class="small muted">Interfejs może pozostać anonimowy. Identyfikator techniczny: ${esc(state.guestId.slice(0,8))}…</div></div><button class="secondary" onclick="show('profile')">Profil</button></div><div class="small muted" style="margin-top:8px">Docelowo tożsamość gościa zabezpieczymy przez WebAuthn/passkey. Biometria urządzenia nie jest przekazywana WorkHub.</div></div></div>
 <div class="card"><div class="row"><div><h3>🔔 Powiadomienia</h3><div class="muted">${unreadCount()?`Masz <b>${unreadCount()}</b> nowych.`:"Brak nowych."}</div></div><button class="secondary" onclick="show('notifications')">Zobacz</button></div></div>`;
 document.getElementById("homeRadius").value=String(state.radiusKm||10);
 document.querySelectorAll('[data-home-cat]').forEach(b=>b.onclick=()=>{state.jobCat=b.dataset.homeCat;document.querySelectorAll('[data-home-cat]').forEach(x=>x.classList.toggle('active',x===b));runHomeSearch()});
 runHomeSearch();
}
function distanceKm(item){
 if(item.distanceKm!=null && isFinite(Number(item.distanceKm)))return Number(item.distanceKm);
 const m=String(item.distance||"").replace(',','.').match(/([0-9]+(?:\.[0-9]+)?)/);return m?Number(m[1]):null;
}
function matchesHome(item,q,area,cat,radius){
 const text=norm([item.title,item.name,item.service,item.desc,item.cat,item.area,item.qrPoint,item.qrId,item.price,item.when,item.availability].join(' '));
 const place=norm(item.area);
 const d=itemDistanceKm(item);
 return (!q||text.includes(q))&&(!area||place.includes(area))&&(cat==='Wszystko'||norm(item.cat)===norm(cat))&&(d==null||d<=radius);
}
function runHomeSearch(){
 const q=norm(document.getElementById('homeSearch')?.value||"");
 const area=(document.getElementById('homeArea')?.value||state.area||"").trim();
 const radius=Number(document.getElementById('homeRadius')?.value||state.radiusKm||10);
 state.searchText=document.getElementById('homeSearch')?.value||"";state.searchArea=area;state.radiusKm=radius;state.area=area||state.area;save();
 const cat=state.jobCat||"Wszystko";
 const jobs=(state.jobs||[]).filter(j=>matchesHome(j,q,norm(area),cat,radius));
 const offers=(state.offers||[]).filter(o=>matchesHome(o,q,norm(area),cat,radius));
 const out=document.getElementById('homeResults');if(!out)return;
 document.getElementById('homeSearchInfo').textContent=`${jobs.length} zleceń · ${offers.length} ofert wykonawców · promień ${radius} km`;

function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function haversineKm(a,b,c,d){
 const R=6371, p=Math.PI/180; const dLat=(c-a)*p,dLon=(d-b)*p;
 const x=Math.sin(dLat/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));
}
function itemDistanceKm(item){
 if(state.coords && item.lat!=null && item.lng!=null && isFinite(Number(item.lat)) && isFinite(Number(item.lng))) return haversineKm(Number(state.coords.lat),Number(state.coords.lng),Number(item.lat),Number(item.lng));
 return distanceKm(item);
}
function filterJobs(){
 const q=norm(state.searchText||document.getElementById('search')?.value||'');

 const cat=state.jobCat||'Wszystko';
 const results=document.getElementById('results'); if(!results)return;
 const jobs=state.jobs.filter(j=>{
   const text=norm([j.title,j.desc,j.cat,j.area,j.qrPoint,j.qrId,j.price,j.when].join(' '));
   const place=norm(j.area);
   return (!q||text.includes(q)) && (!area||place.includes(area)) && (cat==='Wszystko'||norm(j.cat)===norm(cat));
 });
 const offers=(state.offers||[]).filter(o=>{
   const text=norm([o.name,o.service,o.desc,o.cat,o.area,o.availability].join(' '));
   const place=norm(o.area);
   return (!q||text.includes(q)) && (!area||place.includes(area)) && (cat==='Wszystko'||norm(o.cat)===norm(cat));
 });
 document.getElementById('jobCount').textContent=`(${jobs.length})`;
 document.getElementById('offerCount').textContent=`(${offers.length})`;

function createJob(){
 const title=document.getElementById("title").value.trim();
 if(!title){alert("Podaj tytuł zlecenia.");return}

 // Publikujemy najpierw samo zlecenie. Zdjęcie jest dodatkiem i nie może blokować publikacji.
 const job={
  id:Date.now(),
  title,
  cat:document.getElementById("cat").value,
  area:document.getElementById("area").value||state.area,
  distance:"lokalnie",
  price:document.getElementById("price").value||"do uzgodnienia",
  when:document.getElementById("when").value||"do uzgodnienia",
  desc:document.getElementById("desc").value||"",
  status:"open",
  qr:!!state.qrContext,
  qrId:state.qrContext||"",
  qrPoint:qrPoint(),
  photo:""
 };

 state.jobs.unshift(job);
 if(!save()){
   state.jobs.shift();
   alert("Nie udało się zapisać zlecenia w pamięci przeglądarki. Spróbuj odświeżyć stronę i ponownie opublikować.");
   return;
 }

 const file=document.getElementById("photo")?.files?.[0];
 const sharedPayload={title:job.title,cat:job.cat,area:job.area,price:job.price,when:job.when,desc:job.desc,qrId:job.qrId,qrPoint:job.qrPoint,author:state.name||"Gość",guestId:state.guestId,lat:state.coords?.lat||"",lng:state.coords?.lng||""};
 if(BACKEND_ENABLED){
   backendCall("createJob",sharedPayload).then(r=>{
     if(r&&r.ok){
       const idx=state.jobs.findIndex(x=>x.id===job.id);if(idx>=0){state.jobs[idx].id=r.id;state.jobs[idx].shared=true;save();}
     }else console.warn("Nie zapisano w bazie:",r);
   }).catch(e=>console.warn(e));
 }
 if(file){
   const reader=new FileReader();
   reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const max=700;
        const scale=Math.min(1,max/Math.max(img.naturalWidth||700,img.naturalHeight||700));
        const w=Math.max(1,Math.round((img.naturalWidth||700)*scale));
        const h=Math.max(1,Math.round((img.naturalHeight||700)*scale));
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL("image/jpeg",0.5);
        const idx=state.jobs.findIndex(x=>x.id===job.id);
        if(idx>=0){
          state.jobs[idx].photo=compressed;
          if(!save()){
            state.jobs[idx].photo="";
            save();
          }
        }
      }catch(e){console.warn("Zdjęcie pominięte:",e)}
      show("jobs");
    };
    img.onerror=()=>show("jobs");
    img.src=reader.result;
   };
   reader.onerror=()=>show("jobs");
   reader.readAsDataURL(file);
 }else{
   alert(state.qrContext?"Zgłoszenie zostało opublikowane i przypisane do punktu QR.":"Zlecenie zostało opublikowane.");
   show("jobs");
 }
}

function saveProfile(){state.name=document.getElementById("name").value||"Gość";state.area=document.getElementById("profarea").value||"Zawiercie";save();alert("Profil zapisany.");show("profile")}
function qrManager(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>📲 Generator QR WorkHub</h2><div class="muted">Każdy punkt może mieć własny adres QR. Po zeskanowaniu telefon otworzy WorkHub z kontekstem punktu.</div>
 <label>Identyfikator punktu</label><input id="qrid" value="ZAW001" placeholder="np. SKLEP-ZAW-01"><button class="primary" onclick="makeQR()">Wygeneruj QR</button><div id="qrout"></div>
 <button class="secondary" style="margin-top:8px" onclick="show('home')">← Wróć</button></div>`;
}
function makeQR(){
 const id=document.getElementById("qrid").value.trim()||"ZAW001",url=location.origin+location.pathname+"?qr="+encodeURIComponent(id),out=document.getElementById("qrout");
 out.innerHTML=`<div class="qrpreview"><div id="qrcode"></div></div><div class="small" style="word-break:break-all">${esc(url)}</div><div class="notice" style="margin-top:10px">📷 Ten kod można później wykorzystać na naklejce WorkHub.</div>`;
 new QRCode(document.getElementById("qrcode"),{text:url,width:220,height:220});
}
(function init(){
 const p=new URLSearchParams(location.search).get("qr");if(p)state.qrContext=p;save();show("home");
 if(BACKEND_ENABLED) {setTimeout(()=>syncBackend(false),250);startPolling();}
 updateNotifBadge();
})();
</script>
