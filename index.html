<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>WorkHub — lokalne zlecenia v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#667085;--line:#e4e9f0;--blue:#2563eb;--green:#16a34a;--dark:#0b1220;--soft:#eef4ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0b1220,#172554);color:#fff;padding:22px 18px 28px;border-radius:0 0 24px 24px}
.logo{font-size:28px;font-weight:800;letter-spacing:-.7px}.tag{opacity:.8;margin-top:3px;font-size:13px}
main{max-width:760px;margin:auto;padding:16px 14px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #0b122008}
h1{font-size:27px}h2,h3{margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:13px;padding:13px 14px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:var(--soft);color:#1744a2}.green{background:#eaf8ef;color:#08752f}.dark{background:var(--dark);color:#fff}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:5px 0 10px;background:#fff}textarea{min-height:90px;resize:vertical}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:7px env(safe-area-inset-right) calc(7px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.nav button{background:none;color:var(--muted);font-size:12px;padding:8px 15px}.nav button.active{color:var(--blue)}
.job{border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:99px;background:#eef2f7;color:#4b5563}.price{font-weight:800;color:#0f7a35}
.chat{height:48vh;overflow:auto;background:#f7f9fc;border-radius:14px;padding:12px}.msg{max-width:82%;padding:10px 12px;border-radius:14px;margin:7px 0;font-size:14px}.me{background:#dbeafe;margin-left:auto}.them{background:#fff;border:1px solid var(--line)}
.small{font-size:12px}.hero{text-align:center;padding:12px 4px 4px}.hero h1{margin:0 0 6px}.notice{background:#fff8df;border:1px solid #f4df91;padding:11px;border-radius:12px;font-size:12px}
.qrpreview{display:flex;justify-content:center;padding:18px;background:#fff;border:1px dashed #cbd5e1;border-radius:16px;margin:12px 0}.tag2{display:inline-block;background:#eef4ff;color:#2451a6;border-radius:99px;padding:5px 9px;font-size:11px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#f7f9fc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}
.photo-preview{max-width:100%;max-height:220px;border-radius:14px;border:1px solid var(--line);margin-top:8px;display:none}.qr-action{background:#eff6ff;border:1px solid #bfdbfe;border-radius:16px;padding:14px;margin-top:10px}.hide{display:none!important}
</style>
</head>
<body>
<header><div class="logo">WORKHUB</div><div class="tag">Lokalne zlecenia. Lokalni ludzie.</div></header>
<main id="app"></main>
<div class="nav">
<button onclick="show('home')" id="n-home">⌂<br>Start</button>
<button onclick="show('jobs')" id="n-jobs">🔧<br>Zlecenia</button>
<button onclick="show('add')" id="n-add">＋<br>Dodaj</button>
<button onclick="show('chat')" id="n-chat">💬<br>Czat</button>
<button onclick="show('profile')" id="n-profile">●<br>Profil</button>
</div>
<script>
const KEY="workhub_v2";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 mode:null,name:"Gość",area:"Zawiercie",qrContext:"",
 jobs:[
 {id:1,title:"Montaż karnisza",cat:"Montaż",area:"Zawiercie",distance:"1,8 km",price:"80–150 zł",when:"Dzisiaj",desc:"Potrzebuję montażu karnisza w salonie.",status:"open"},
 {id:2,title:"Koszenie trawy",cat:"Ogród",area:"Poręba",distance:"6,2 km",price:"120–180 zł",when:"Weekend",desc:"Działka około 500 m².",status:"open"},
 {id:3,title:"Drobna naprawa drzwi",cat:"Naprawy",area:"Zawiercie",distance:"3,1 km",price:"100–200 zł",when:"Do uzgodnienia",desc:"Drzwi wymagają regulacji i poprawienia zawiasu.",status:"open"}
 ],messages:[],current:null
};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function show(page){
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 const n=document.getElementById("n-"+page);if(n)n.classList.add("active");
 if(page==="home")home();if(page==="jobs")jobs();if(page==="add")add();if(page==="chat")chat();if(page==="profile")profile();
}
function qrPoint(){return state.qrContext?({ZAW001:"Punkt WorkHub – Zawiercie",POR001:"Punkt WorkHub – Poręba"}[state.qrContext]||("Punkt WorkHub – "+state.qrContext)):""}
function home(){
 const p=qrPoint();
 document.getElementById("app").innerHTML=
 `<div class="hero"><h1>Znajdź pracę albo wykonawcę</h1><div class="muted">WorkHub łączy lokalne potrzeby z lokalnymi umiejętnościami.</div></div>
 ${p?`<div class="card" style="border-color:#93c5fd"><span class="tag2">QR AKTYWNY</span><h3>📍 ${esc(p)}</h3><div class="muted">Zeskanowany kod wskazuje konkretny punkt, obiekt lub urządzenie.</div><div class="qr-action"><b>Masz potrzebę w tym miejscu?</b><div class="small" style="margin:5px 0 10px">Opisz problem lub pracę do wykonania — punkt QR zostanie automatycznie przypisany do zlecenia.</div><button class="primary" onclick="add(true)">⚠️ ZGŁOŚ POTRZEBĘ</button></div></div>`:""}
 <div class="card"><h2>Co chcesz zrobić?</h2><div class="grid">
 <button class="primary" onclick="setMode('client')">📣 ZLECAM PRACĘ</button>
 <button class="green" onclick="setMode('worker')">🛠️ SZUKAM ZLECEŃ</button></div></div>
 <div class="card"><h3>📲 WorkHub QR</h3><div class="muted">Kody mogą być umieszczane w sklepach, punktach usługowych, budynkach i przy urządzeniach.</div><br>
 <button class="secondary" onclick="qrManager()">Pokaż przykładowy QR</button></div>
 <div class="card"><h3>📍 Twoja okolica</h3><div class="muted">Obszar: <b>${esc(state.area)}</b></div><br>
 <div class="stat"><div><b>${state.jobs.length}</b><span class="small">zleceń</span></div><div><b>lokalnie</b><span class="small">dopasowanie</span></div><div><b>24/7</b><span class="small">dostęp</span></div></div></div>`;
}
function setMode(m){state.mode=m;save();show(m==="client"?"add":"jobs")}
function jobs(){
 const worker=state.mode==="worker";
 document.getElementById("app").innerHTML=`<div class="card"><div class="row"><div><h2>${worker?"Zlecenia w okolicy":"Lokalne zlecenia"}</h2><div class="muted">${esc(state.area)} i okolice</div></div><span class="pill">${state.jobs.length} ofert</span></div>
 <div class="grid" style="margin:10px 0"><button class="secondary" onclick="setMode('client')">📣 Zlecaj</button><button class="green" onclick="setMode('worker')">🛠️ Szukam</button></div>
 ${state.jobs.map(j=>`<div class="job"><div class="row"><b>${esc(j.title)}</b><span class="price">${esc(j.price)}</span></div>
 <div class="muted">${esc(j.cat)} · 📍 ${esc(j.area)} · ${esc(j.distance)}</div><div class="small">🕐 ${esc(j.when)} ${j.qr?`· 📲 QR ${esc(j.qrId||"")}`:""}</div>${j.qrPoint?`<div class="small">📍 ${esc(j.qrPoint)}</div>`:""}<p class="small">${esc(j.desc)}</p>${j.photo?`<img src="${j.photo}" alt="Zdjęcie zlecenia" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin:6px 0">`:""}
 <button class="secondary" onclick="openJob(${j.id})">Zobacz zlecenie</button></div>`).join("")}</div>
 <div class="card"><h3>🎯 Dopasowanie</h3><div class="muted">Docelowo wykonawca zobaczy przede wszystkim zlecenia zgodne z kategoriami umiejętności, obszarem i dostępnością.</div></div>`;
}
function add(fromQR=false){
 const p=qrPoint();
 document.getElementById("app").innerHTML=`<div class="card"><h2>${p?"⚠️ Zgłoszenie potrzeby":"➕ Nowe zlecenie"}</h2><div class="muted">${p?"Opisz problem, usterkę albo pracę potrzebną w tym punkcie.":"Dodaj potrzebę. Szczegóły, termin i cenę strony ustalają między sobą."}</div>
 ${p?`<div class="notice" style="margin:10px 0">📲 <b>Powiązane z QR:</b> ${esc(p)}<br><span class="small">Identyfikator: ${esc(state.qrContext)}</span></div>`:""}
 <label>Kategoria</label><select id="cat"><option>Naprawy</option><option>Montaż</option><option>Remont</option><option>Ogród</option><option>Transport</option><option>Pomoc techniczna</option><option>Sprzątanie</option><option>Awaria / usterka</option><option>Inne</option></select>
 <label>Tytuł</label><input id="title" placeholder="Np. uszkodzone drzwi / potrzebny montaż półki">
 <label>Opis</label><textarea id="desc" placeholder="Co się stało? Co trzeba zrobić? Jakie są najważniejsze szczegóły?"></textarea>
 <label>Zdjęcie – opcjonalnie</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="previewPhoto(this)"><img id="photoPreview" class="photo-preview" alt="Podgląd zdjęcia">
 <label>Okolica</label><input id="area" value="${esc(p?p.replace(/^Punkt WorkHub – /,""):state.area)}">
 <label>Termin</label><input id="when" placeholder="Np. dzisiaj po 17:00">
 <label>Budżet – opcjonalnie</label><input id="price" placeholder="Np. 100–150 zł / do uzgodnienia">
 <button class="primary" onclick="createJob()">${p?"📢 OPUBLIKUJ ZGŁOSZENIE":"📢 Publikuję zlecenie"}</button>
 <button class="secondary" style="margin-top:8px" onclick="show('home')">← Wróć</button>
 <div class="notice" style="margin-top:12px">ℹ️ Ceny w WorkHub są orientacyjne. Ostateczne wynagrodzenie ustalają zlecający i wykonawca.</div></div>`;
}
function previewPhoto(input){
 const file=input.files&&input.files[0],img=document.getElementById("photoPreview");
 if(!file||!img)return; const r=new FileReader(); r.onload=()=>{img.src=r.result;img.style.display="block"}; r.readAsDataURL(file);
}
function createJob(){
 const title=document.getElementById("title").value.trim();if(!title){alert("Podaj tytuł zlecenia.");return}
 const file=document.getElementById("photo")?.files?.[0];
 const finish=(photoData="")=>{
  const job={id:Date.now(),title,cat:document.getElementById("cat").value,area:document.getElementById("area").value||state.area,distance:"lokalnie",price:document.getElementById("price").value||"do uzgodnienia",when:document.getElementById("when").value||"do uzgodnienia",desc:document.getElementById("desc").value||"",status:"open",qr:!!state.qrContext,qrId:state.qrContext||"",qrPoint:qrPoint(),photo:photoData};
  state.jobs.unshift(job);save();alert(state.qrContext?"Zgłoszenie przypisane do punktu QR i zapisane w wersji testowej WorkHub.":"Zlecenie dodane do lokalnej wersji testowej WorkHub.");show("jobs");
 };
 if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish();
}
function openJob(id){
 const j=state.jobs.find(x=>x.id===id);state.current=id;save();
 document.getElementById("app").innerHTML=`<div class="card"><div class="muted">${esc(j.cat)} · 📍 ${esc(j.area)} · ${esc(j.distance)}</div><h2>${esc(j.title)}</h2><p>${esc(j.desc)}</p>
 <div class="row"><b>💰 ${esc(j.price)}</b><span>🕐 ${esc(j.when)}</span></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0">
 <div class="muted">Cena i szczegóły są ustalane bezpośrednio przez strony.</div>
 ${j.qrPoint?`<div class="notice" style="margin-top:12px">📲 Zgłoszenie z punktu QR: <b>${esc(j.qrPoint)}</b> · ${esc(j.qrId)}</div>`:""}
 ${j.photo?`<img src="${j.photo}" alt="Zdjęcie zlecenia" style="width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin-top:12px">`:""}<br>
 <button class="primary" onclick="startChat(${j.id})">💬 Napisz w sprawie zlecenia</button>
 <button class="secondary" style="margin-top:8px" onclick="show('jobs')">← Wróć</button></div>`;
}
function startChat(id){state.current=id;save();show("chat")}
function chat(){
 const j=state.jobs.find(x=>x.id===state.current)||state.jobs[0],msgs=state.messages.filter(m=>m.job===j.id);
 document.getElementById("app").innerHTML=`<div class="card"><h2>💬 Czat zlecenia</h2><div class="muted">🔧 ${esc(j.title)} · 📍 ${esc(j.area)}</div>
 <div class="chat">${msgs.length?msgs.map(m=>`<div class="msg ${m.me?"me":"them"}">${esc(m.text)}</div>`).join(""):`<div class="muted" style="text-align:center;padding:30px 10px">Tutaj strony mogą ustalić zakres, termin, cenę i dobrowolnie wymienić dane kontaktowe.</div>`}</div>
 <div class="row" style="margin-top:8px"><input id="msg" placeholder="Napisz wiadomość..." onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">Wyślij</button></div></div>`;
}
function send(){const v=document.getElementById("msg").value.trim();if(!v)return;state.messages.push({job:state.current,text:v,me:true});save();show("chat")}
function profile(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>👤 Profil WorkHub</h2><label>Nazwa / pseudonim</label><input id="name" value="${esc(state.name)}"><label>Obszar działania</label><input id="profarea" value="${esc(state.area)}"><button class="primary" onclick="saveProfile()">Zapisz</button></div>
 <div class="card"><h3>Tryb użytkownika</h3><div class="grid"><button class="secondary" onclick="setMode('client')">📣 Zlecający</button><button class="green" onclick="setMode('worker')">🛠️ Wykonawca</button></div></div>
 <div class="card"><h3>🔐 Prywatność</h3><div class="muted">WorkHub projektujemy w modelu minimalizacji danych. Numer telefonu, dokładny adres i inne dane kontaktowe nie są wymagane. Strony mogą dobrowolnie wymienić dane na czacie.</div></div>
 <div class="card"><h3>📲 QR punktu</h3><button class="secondary" onclick="qrManager()">Otwórz generator QR</button></div>`;
}
function saveProfile(){state.name=document.getElementById("name").value||"Gość";state.area=document.getElementById("profarea").value||"Zawiercie";save();alert("Profil zapisany.");show("profile")}
function qrManager(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>📲 Generator QR WorkHub</h2><div class="muted">Każdy punkt może mieć własny adres QR. Po zeskanowaniu telefon otworzy WorkHub z kontekstem punktu.</div>
 <label>Identyfikator punktu</label><input id="qrid" value="ZAW001" placeholder="np. SKLEP-ZAW-01"><button class="primary" onclick="makeQR()">Wygeneruj QR</button><div id="qrout"></div>
 <button class="secondary" style="margin-top:8px" onclick="show('home')">← Wróć</button></div>`;
}
function makeQR(){
 const id=document.getElementById("qrid").value.trim()||"ZAW001",url=location.origin+location.pathname+"?qr="+encodeURIComponent(id),out=document.getElementById("qrout");
 out.innerHTML=`<div class="qrpreview"><div id="qrcode"></div></div><div class="small" style="word-break:break-all">${esc(url)}</div><div class="notice" style="margin-top:10px">📷 Ten kod można później wykorzystać na naklejce WorkHub.</div>`;
 new QRCode(document.getElementById("qrcode"),{text:url,width:220,height:220});
}
(function init(){
 const p=new URLSearchParams(location.search).get("qr");if(p)state.qrContext=p;save();show("home");
})();
</script>
</body>
</html>
