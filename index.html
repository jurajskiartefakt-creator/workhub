<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1530"><title>WorkHub</title><style>
:root{--blue:#2864e8;--navy:#0b1530;--bg:#f4f7fb;--text:#16233b;--muted:#667085;--green:#178044;--line:#dce4ef;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:14px;padding:13px 17px;font-weight:800;cursor:pointer}.top{background:var(--navy);color:#fff;padding:28px max(20px,calc((100% - 900px)/2));border-radius:0 0 26px 26px}.top h1{margin:0;font-size:30px}.top p{margin:5px 0 0;color:#c6d0e5}.wrap{max-width:900px;margin:0 auto;padding:20px 16px 100px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #13213b0b}.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:800;margin:9px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;color:var(--text)}textarea{min-height:110px}.primary{background:var(--blue);color:white}.ghost{background:#edf3ff;color:#244f9e}.green{background:#e9f8ef;color:#14743d}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf3ff;color:#2855a4;font-size:13px;font-weight:800;margin:3px}.meta{color:var(--muted);font-size:14px}.price{font-size:21px;color:var(--green);font-weight:900;float:right}.item{border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;background:#fff}.item h3{margin:0 0 6px;font-size:19px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button.active{background:var(--blue);color:#fff}.small{font-size:12px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.nav button{border-radius:0;background:#fff;color:#647084;min-width:95px;padding:10px 8px}.nav button.active{color:var(--blue)}.chat{height:55vh;overflow:auto;background:#f6f8fc;border-radius:16px;padding:12px}.bubble{max-width:78%;padding:11px 14px;border-radius:16px;margin:8px 0}.mine{margin-left:auto;background:#dce8ff}.theirs{background:#fff;border:1px solid var(--line)}.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.danger{color:#b42318}.notice{background:#fff8dc;border:1px solid #f0d879;padding:12px;border-radius:14px}.range{width:100%}
</style></head><body><header class="top"><h1>WORKHUB</h1><p>Lokalny rynek usług i towarów. Anonimowo. Blisko Ciebie.</p></header><main class="wrap" id="app"></main><nav class="nav"><button data-nav="home">🏠<br>Start</button><button data-nav="add">＋<br>Dodaj</button><button data-nav="favorites">⭐<br>Obserw.</button><button data-nav="chat">💬<br>Czat</button><button data-nav="profile">👤<br>Profil</button></nav>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbw_SxYnRGlUWk6iMHemDNWXcdO16VQgqKbvCkzycT58l1oW4dQngR_glPfa3YW68CWv/exec';
const GUEST_KEY='workhub_guest_v2';const STATE_KEY='workhub_market_v2';
const state={market:[],messages:[],favorites:[],lat:null,lng:null,accuracy:null,search:'',radius:10,kind:'ALL',side:'ALL',area:'',view:'home',item:null,toast:''};
let guestId=localStorage.getItem(GUEST_KEY);if(!guestId){guestId='G'+crypto.randomUUID().replaceAll('-','').slice(0,20).toUpperCase();localStorage.setItem(GUEST_KEY,guestId)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveLocal(){localStorage.setItem(STATE_KEY,JSON.stringify({market:state.market,messages:state.messages,favorites:state.favorites}))}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STATE_KEY)||'{}');state.market=x.market||[];state.messages=x.messages||[];state.favorites=x.favorites||[]}catch{}}
function backend(action,data={}){return new Promise((resolve,reject)=>{const cb='whcb_'+Date.now()+'_'+Math.random().toString(36).slice(2);window[cb]=(r)=>{delete window[cb];script.remove();r&&r.ok?resolve(r):reject(new Error(r?.error||'Backend error'))};const script=document.createElement('script');script.src=BACKEND_URL+'?action='+encodeURIComponent(action)+'&callback='+cb+'&data='+encodeURIComponent(JSON.stringify(data));script.onerror=()=>{delete window[cb];script.remove();reject(new Error('Brak połączenia z bazą'))};document.body.appendChild(script);setTimeout(()=>{if(window[cb]){delete window[cb];script.remove();reject(new Error('Przekroczono czas odpowiedzi'))}},12000)})}
function dist(a,b,c,d){if([a,b,c,d].some(x=>x===null||x===''||isNaN(Number(x))))return null;const R=6371,rad=x=>x*Math.PI/180,dLat=rad(c-a),dLon=rad(d-b);const q=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(false);navigator.geolocation.getCurrentPosition(p=>{state.lat=p.coords.latitude;state.lng=p.coords.longitude;state.accuracy=p.coords.accuracy;render();res(true)},()=>res(false),{enableHighAccuracy:true,timeout:8000,maximumAge:60000})})}
function normalize(){state.market=state.market.map(x=>({...x,ID:String(x.ID||''),SIDE:x.SIDE==='SELL'?'SELL':'BUY',KIND:x.KIND==='PRODUCT'?'PRODUCT':'SERVICE'}));}
async function sync(){try{const r=await backend('list',{guestId});state.market=r.market||[];state.messages=r.messages||[];state.favorites=r.favorites||[];normalize();saveLocal();render()}catch(e){console.warn(e);toast('Pracujesz na ostatnich zapisanych danych.');}}
function toast(t){state.toast=t;render();setTimeout(()=>{state.toast='';render()},2600)}
function match(x){const q=state.search.trim().toLowerCase();if(q){const hay=[x.TYTUL,x.KATEGORIA,x.OBSZAR,x.OPIS,x.CENA,x.TERMIN,x.KIND,x.SIDE].join(' ').toLowerCase();if(!hay.includes(q))return false}if(state.kind!=='ALL'&&x.KIND!==state.kind)return false;if(state.side!=='ALL'&&x.SIDE!==state.side)return false;if(state.area.trim()&&!String(x.OBSZAR||'').toLowerCase().includes(state.area.trim().toLowerCase()))return false;const d=dist(state.lat,state.lng,x.LAT,x.LNG);x.__distance=d;if(state.lat!==null&&state.lng!==null&&d!==null&&d>state.radius&&!state.favorites.includes(x.ID))return false;return String(x.STATUS||'open')!=='closed'}
function card(x){const d=x.__distance;const fav=state.favorites.includes(x.ID);return `<article class="item"><div class="row"><h3>${x.SIDE==='BUY'?'🛒':'🏷️'} ${esc(x.TYTUL)}</h3><span class="price">${esc(x.CENA||'do uzgodnienia')}</span></div><div><span class="pill">${x.SIDE==='BUY'?'KUPUJĘ':'SPRZEDAJĘ'}</span><span class="pill">${x.KIND==='PRODUCT'?'TOWAR':'USŁUGA'}</span><span class="pill">${esc(x.KATEGORIA||'inne')}</span></div><div class="meta">📍 ${esc(x.OBSZAR||'brak lokalizacji')} ${d!==null?`· ${d.toFixed(1)} km`:''} · 🕐 ${esc(x.TERMIN||'do uzgodnienia')}</div><p>${esc(x.OPIS||'')}</p><div class="actions"><button class="primary" data-open="${esc(x.ID)}">Zobacz ofertę</button><button class="ghost" data-fav="${esc(x.ID)}">${fav?'★ Obserwujesz':'☆ Obserwuj'}</button></div></article>`}
function home(){const results=state.market.filter(match).sort((a,b)=>(a.__distance??99999)-(b.__distance??99999)||String(b.UTWORZONO).localeCompare(String(a.UTWORZONO)));return `<section class="search"><div class="card"><h2>🔎 Znajdź w okolicy</h2><div class="grid"><div><label>Czego szukasz?</label><input id="q" value="${esc(state.search)}" placeholder="np. hydraulik, kran, koszenie, rower..."></div><div><label>Gdzie?</label><input id="area" value="${esc(state.area)}" placeholder="np. Zawiercie, Poręba..."></div></div><label>Promień: <b>${state.radius} km</b></label><input class="range" id="radius" type="range" min="1" max="50" value="${state.radius}"><div class="actions"><button class="primary" id="doSearch">🔎 SZUKAJ</button><button class="ghost" id="loc">📍 ${state.lat?'Moja lokalizacja ustawiona':'Użyj mojej lokalizacji'}</button><button class="ghost" id="clear">Wyczyść</button></div><div class="tabs" style="margin-top:12px"><button class="${state.side==='ALL'?'active':''}" data-side="ALL">Wszystko</button><button class="${state.side==='BUY'?'active':''}" data-side="BUY">🛒 Potrzebuję</button><button class="${state.side==='SELL'?'active':''}" data-side="SELL">🏷️ Oferuję</button><button class="${state.kind==='PRODUCT'?'active':''}" data-kind="PRODUCT">📦 Towary</button></div><div class="small">Wspólny strumień pokazuje oferty w Twoim promieniu. Obserwowane pozostają dostępne także poza promieniem.</div></div></section><div class="card"><div class="row"><h2>📍 Oferty w okolicy</h2><span class="pill">${results.length}</span></div>${results.length?results.map(card).join(''):'<p class="meta">Brak ofert spełniających warunki. Zmień słowo, promień lub dodaj własną ofertę.</p>'}</div>`}
function add(){return `<div class="card"><div class="tabs"><button class="${state.side!=='SELL'?'active':''}" data-formside="BUY">🛒 Kupuję / potrzebuję</button><button class="${state.side==='SELL'?'active':''}" data-formside="SELL">🏷️ Sprzedaję / oferuję</button></div><h2>Dodaj ofertę</h2><div class="grid"><div><label>Co?</label><input id="title" placeholder="np. Potrzebuję hydraulika"></div><div><label>Rodzaj</label><select id="kind"><option value="SERVICE">Usługa</option><option value="PRODUCT">Towar</option></select></div></div><label>Kategoria</label><input id="cat" placeholder="np. Naprawy, transport, ogród..."><label>Gdzie?</label><input id="aarea" value="Zawiercie"><div class="grid"><div><label>Cena / budżet</label><input id="price" placeholder="np. 100–150 zł"></div><div><label>Termin / dostępność</label><input id="when" placeholder="np. dzisiaj po 17:00"></div></div><label>Opis</label><textarea id="desc" placeholder="Szczegóły oferty..."></textarea><div class="notice">🔐 Twoja oferta będzie publiczna w promieniu, ale Twój identyfikator pozostanie pseudonimowy.</div><button class="primary" id="publish">Opublikuj ofertę</button></div>`}
function detail(){const x=state.market.find(i=>String(i.ID)===String(state.item));if(!x){return `<div class="card"><h2>Nie znaleziono oferty</h2><button class="primary" data-nav="home">Wróć</button></div>`}const mine=x.GUEST_ID===guestId;return `<div class="card"><button class="ghost" data-nav="home">← Wróć</button><h2>${x.SIDE==='BUY'?'🛒':'🏷️'} ${esc(x.TYTUL)}</h2><div><span class="pill">${x.SIDE==='BUY'?'KUPUJĘ':'SPRZEDAJĘ'}</span><span class="pill">${x.KIND==='PRODUCT'?'TOWAR':'USŁUGA'}</span></div><p class="meta">📍 ${esc(x.OBSZAR)} · 🕐 ${esc(x.TERMIN||'do uzgodnienia')}</p><h3>${esc(x.CENA||'do uzgodnienia')}</h3><p>${esc(x.OPIS||'')}</p>${mine?'<div class="notice">To Twoja oferta.</div>':`<div class="actions"><button class="primary" id="openChat">💬 Zainteresowany — rozpocznij anonimowy czat</button><button class="ghost" data-fav="${esc(x.ID)}">${state.favorites.includes(x.ID)?'★ Obserwujesz':'☆ Obserwuj'}</button></div>`}</div>`}
function chat(){const x=state.market.find(i=>String(i.ID)===String(state.item));if(!x)return `<div class="card"><h2>Wybierz ofertę</h2></div>`;const msgs=state.messages.filter(m=>String(m.JOB_ID||m.OFFER_ID||'')===String(x.ID));return `<div class="card"><button class="ghost" data-nav="home">← Wróć</button><h2>💬 Czat</h2><div class="meta">${esc(x.TYTUL)} · 📍 ${esc(x.OBSZAR)} · anonimowo</div><div class="chat">${msgs.length?msgs.map(m=>`<div class="bubble ${String(m.GUEST_ID)===guestId?'mine':'theirs'}"><div>${esc(m.TEKST)}</div><div class="small">${String(m.GUEST_ID)===guestId?'Ty':'Gość WorkHub'}</div></div>`).join(''):'<p class="meta">Rozpocznij rozmowę. Druga strona nie zobaczy Twoich danych osobowych.</p>'}</div><div class="actions"><input id="msg" placeholder="Napisz wiadomość..."><button class="primary" id="send">Wyślij</button></div></div>`}
function favorites(){const items=state.market.filter(x=>state.favorites.includes(x.ID));return `<div class="card"><h2>⭐ Obserwowane</h2><p class="meta">Obserwowane oferty pozostają widoczne nawet po wyjściu poza ich aktualny promień.</p>${items.length?items.map(card).join(''):'<p class="meta">Nie obserwujesz jeszcze żadnej oferty.</p>'}</div>`}
function profile(){return `<div class="card"><h2>👤 Twój WorkHub</h2><p>Interfejsowo jesteś anonimowy.</p><div class="notice">Twój pseudonimowy identyfikator urządzenia:<br><b>${esc(guestId)}</b></div><p class="meta">Docelowo ten identyfikator zostanie związany z passkey/WebAuthn. WorkHub nie powinien przechowywać Twojej biometrii.</p><button class="primary" id="sync">🔄 Synchronizuj bazę</button><button class="ghost" id="geo">📍 Ustaw lokalizację</button></div>`}
function render(){const app=document.getElementById('app');let html=state.view==='home'?home():state.view==='add'?add():state.view==='detail'?detail():state.view==='chat'?chat():state.view==='favorites'?favorites():profile();if(state.toast)html=`<div class="notice">${esc(state.toast)}</div>`+html;app.innerHTML=html;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav==='favorites'?'favorites':b.dataset.nav;state.item=null;render()});bind();}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.item=b.dataset.open;state.view='detail';render()});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=async()=>{const id=b.dataset.fav;const on=!state.favorites.includes(id);if(on)state.favorites.push(id);else state.favorites=state.favorites.filter(x=>x!==id);saveLocal();render();try{await backend('favorite',{guestId,itemId:id,on})}catch(e){toast('Nie udało się zapisać obserwowanej oferty.')}});document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{state.side=b.dataset.side;render()});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{state.kind=b.dataset.kind;render()});document.querySelectorAll('[data-formside]').forEach(b=>b.onclick=()=>{state.side=b.dataset.formside;render()});const q=document.getElementById('q');const ar=document.getElementById('area');const doSearch=document.getElementById('doSearch');if(doSearch)doSearch.onclick=()=>{state.search=q?.value||'';state.area=ar?.value||'';render()};if(q)q.onkeydown=e=>{if(e.key==='Enter'){state.search=q.value;state.area=ar?.value||'';render()}};if(ar)ar.onkeydown=e=>{if(e.key==='Enter'){state.search=q?.value||'';state.area=ar.value;render()}};const rr=document.getElementById('radius');if(rr)rr.oninput=e=>{state.radius=Number(e.target.value);render()};const loc=document.getElementById('loc');if(loc)loc.onclick=async()=>{const ok=await getPos();toast(ok?'Lokalizacja ustawiona.':'Nie udało się pobrać lokalizacji. Możesz użyć miejscowości.');};const clear=document.getElementById('clear');if(clear)clear.onclick=()=>{state.search='';state.area='';state.side='ALL';state.kind='ALL';render()};const open=document.getElementById('openChat');if(open)open.onclick=()=>{state.view='chat';render()};const send=document.getElementById('send');if(send)send.onclick=sendMsg;const msg=document.getElementById('msg');if(msg)msg.onkeydown=e=>{if(e.key==='Enter')sendMsg()};const pub=document.getElementById('publish');if(pub)pub.onclick=publish;const syncBtn=document.getElementById('sync');if(syncBtn)syncBtn.onclick=()=>sync();const geo=document.getElementById('geo');if(geo)geo.onclick=()=>getPos().then(()=>toast('Lokalizacja ustawiona.'))}
async function publish(){const title=document.getElementById('title').value.trim(),desc=document.getElementById('desc').value.trim();if(!title||!desc)return toast('Uzupełnij tytuł i opis.');const d={side:state.side==='SELL'?'SELL':'BUY',kind:document.getElementById('kind').value,title,cat:document.getElementById('cat').value,area:document.getElementById('aarea').value,price:document.getElementById('price').value,when:document.getElementById('when').value,desc,lat:state.lat,lng:state.lng,guestId,qrId:new URLSearchParams(location.search).get('qr')||'',qrPoint:document.querySelector('.pill')?.textContent||''};try{const r=await backend('createMarket',d);state.market.unshift({...d,ID:r.id,STATUS:'open',UTWORZONO:new Date().toISOString(),GUEST_ID:guestId,SIDE:d.side,KIND:d.kind});saveLocal();state.view='home';toast('Oferta została opublikowana.');render()}catch(e){toast('Nie udało się opublikować: '+e.message)}}
async function sendMsg(){const input=document.getElementById('msg');const text=input?.value.trim();const x=state.market.find(i=>String(i.ID)===String(state.item));if(!text||!x)return;const temp={ID:'TEMP'+Date.now(),THREAD:'ITEM:'+x.ID,JOB_ID:x.ID,OFFER_ID:x.ID,TEKST:text,GUEST_ID:guestId,AUTOR:'Gość WorkHub',TO_GUEST_ID:x.GUEST_ID||'' ,UTWORZONO:new Date().toISOString()};state.messages.push(temp);saveLocal();render();try{const r=await backend('sendMessage',{guestId,toGuestId:x.GUEST_ID,itemId:x.ID,text,author:'Gość WorkHub'});const i=state.messages.findIndex(m=>m.ID===temp.ID);if(i>=0)state.messages[i]={...temp,ID:r.id,TO_GUEST_ID:r.toGuestId||temp.TO_GUEST_ID};saveLocal();render()}catch(e){toast('Nie udało się zapisać wiadomości: '+e.message)}}
loadLocal();normalize();render();sync();setInterval(sync,20000);backend('registerGuest',{guestId}).catch(()=>{});
</script></body></html>
